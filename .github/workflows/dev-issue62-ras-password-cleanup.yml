name: dev-issue62-ras-password-cleanup

on:
  push:
    branches:
      - dev/issue62-ras-password-cleanup
    paths:
      - .github/workflows/dev-issue62-ras-password-cleanup.yml
      - .github/validation/issue62-transform.ps1

permissions:
  contents: write

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Apply and verify issue 62 transform
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $expectedBase = '339c5955e78b7b7b6dae6f4a2d46bd6de360269d'
          git merge-base --is-ancestor $expectedBase HEAD

          if ((git rev-parse HEAD:.github/validation/issue62-transform.ps1).Trim() -ne 'f21de861b7ce422771703d78c9d4813d17b08b0c') {
            throw 'Unexpected issue62 transform blob.'
          }

          $expectedBlobs = [ordered]@{
            'src/ProxyToAnyConnect/Vpn/RasDialer.cs' = 'c97a1a967d6c9c180d9ad53c1d0bffc217b4cdee'
            'src/ProxyToAnyConnect/Vpn/RasConnectionManager.Core.cs' = '50659b34a32753d880b60bb228ef670bd2f83086'
            'tests/ProxyToAnyConnect.SelfTests/RasDialerSelfTests.cs' = 'b84f757cd604b37f36c31e7a20457fc4d1a161c8'
          }
          foreach ($entry in $expectedBlobs.GetEnumerator()) {
            $actual = (git rev-parse "HEAD:$($entry.Key)").Trim()
            if ($actual -ne $entry.Value) {
              throw "Unexpected base blob for $($entry.Key): $actual"
            }
          }

          & ./.github/validation/issue62-transform.ps1

          $expectedPaths = @($expectedBlobs.Keys | Sort-Object)
          git add -- $expectedPaths
          git config core.whitespace cr-at-eol
          git diff --cached --check
          $staged = @(git diff --cached --name-only | Sort-Object)
          if (($staged -join "`n") -ne ($expectedPaths -join "`n")) {
            throw "Unexpected #62 staged surface: $($staged -join ', ')"
          }
      - name: Full aggregate self-tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          dotnet run --project tests/ProxyToAnyConnect.SelfTests/ProxyToAnyConnect.SelfTests.csproj --configuration Release
      - name: Publish validated issue 62 source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'ras: clear password carrier on every pre-dial exit'
          git push origin HEAD:dev/issue62-ras-password-cleanup
