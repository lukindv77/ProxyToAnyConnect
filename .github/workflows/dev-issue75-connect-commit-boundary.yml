name: dev-issue75-connect-commit-boundary

on:
  push:
    branches:
      - dev/issue75-connect-commit-boundary
    paths:
      - .github/workflows/dev-issue75-connect-commit-boundary.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Apply and verify issue 75 transform
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $expectedBase = 'a9387ac9e88cb85ab7c718f23cdb5e0eb7658e13'
          git merge-base --is-ancestor $expectedBase HEAD

          $expectedProxyBlob = '5b691ba85239497ce975753faef72e35fa0ee967'
          $expectedRunnerBlob = '9c4e48cafa22674ee76bf8689c9d2e6a63f74a47'
          $expectedTransformBlob = 'ff87b3fab37a18c42422a8cec17348cfc031fc89'
          $expectedTestBlob = 'ab8756fde9b350eb06231a8515835e510671bb9b'

          if ((git rev-parse "$expectedBase`:src/ProxyToAnyConnect/Proxy/ProxyServer.cs").Trim() -ne $expectedProxyBlob) {
            throw 'Unexpected #75 base ProxyServer blob.'
          }
          if ((git rev-parse "$expectedBase`:tests/ProxyToAnyConnect.SelfTests/CombinedTestRunner.cs").Trim() -ne $expectedRunnerBlob) {
            throw 'Unexpected #75 base CombinedTestRunner blob.'
          }
          if ((git rev-parse 'HEAD:.github/validation/issue75-transform.ps1').Trim() -ne $expectedTransformBlob) {
            throw 'Unexpected #75 transform blob.'
          }
          if ((git rev-parse 'HEAD:tests/ProxyToAnyConnect.SelfTests/ProxyConnectCommitBoundarySelfTests.cs').Trim() -ne $expectedTestBlob) {
            throw 'Unexpected #75 regression-test blob.'
          }

          & ./.github/validation/issue75-transform.ps1

          git add -- `
            src/ProxyToAnyConnect/Proxy/ProxyServer.cs `
            tests/ProxyToAnyConnect.SelfTests/CombinedTestRunner.cs
          git config core.whitespace cr-at-eol
          git diff --cached --check

          $expectedStaged = @(
            'src/ProxyToAnyConnect/Proxy/ProxyServer.cs'
            'tests/ProxyToAnyConnect.SelfTests/CombinedTestRunner.cs'
          ) | Sort-Object
          $staged = @(git diff --cached --name-only | Sort-Object)
          if (($staged -join "`n") -ne ($expectedStaged -join "`n")) {
            throw "Unexpected #75 staged surface: $($staged -join ', ')"
          }
      - name: Full aggregate self-tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          dotnet run --project tests/ProxyToAnyConnect.SelfTests/ProxyToAnyConnect.SelfTests.csproj --configuration Release
      - name: Publish validated issue 75 source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'proxy: enforce CONNECT response commit boundary'
          git push origin HEAD:dev/issue75-connect-commit-boundary
