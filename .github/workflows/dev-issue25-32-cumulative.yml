name: dev-issue25-32-cumulative

on:
  push:
    branches: [ dev/issue25-32-cumulative ]
    paths:
      - '.github/workflows/dev-issue25-32-cumulative.yml'
      - '.github/scripts/dev-issue25-32.py'

permissions:
  contents: write

jobs:
  validate-and-publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Apply cumulative CONNECT contract
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python .github/scripts/dev-issue25-32.py
          git diff --check
          $changed = @(git diff --name-only)
          if ($changed.Count -ne 2 -or
              $changed -notcontains 'src/ProxyToAnyConnect/Proxy/ProxyServer.cs' -or
              $changed -notcontains 'tests/ProxyToAnyConnect.SelfTests/CombinedTestRunner.cs') {
            throw "Unexpected cumulative CONNECT patch: $($changed -join ', ')"
          }
      - name: Run full aggregate self-tests
        shell: pwsh
        run: dotnet run --project tests/ProxyToAnyConnect.SelfTests/ProxyToAnyConnect.SelfTests.csproj --configuration Release
      - name: Publish cumulative CONNECT source
        shell: pwsh
        run: |
          git config user.name 'ProxyToAnyConnect CI'
          git config user.email 'actions@github.com'
          git add src/ProxyToAnyConnect/Proxy/ProxyServer.cs tests/ProxyToAnyConnect.SelfTests/CombinedTestRunner.cs
          git commit -m 'proxy: enforce strict CONNECT authority and port grammar'
          git push origin HEAD:refs/heads/dev/issue25-32-cumulative
