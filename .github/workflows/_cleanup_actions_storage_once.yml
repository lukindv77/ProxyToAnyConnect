name: One-time cleanup Actions storage

on:
  push:
    paths:
      - '.github/workflows/_cleanup_actions_storage_once.yml'

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete Actions artifacts and caches older than 48 hours
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          cutoff_epoch="$(date -u -d '48 hours ago' +%s)"
          echo "Cutoff (UTC): $(date -u -d '@'"$cutoff_epoch" '+%Y-%m-%dT%H:%M:%SZ')"

          deleted_artifacts=0
          deleted_artifact_bytes=0

          while IFS=$'\t' read -r id created_at size name; do
            [ -z "${id:-}" ] && continue
            created_epoch="$(date -u -d "$created_at" +%s)"
            if (( created_epoch < cutoff_epoch )); then
              echo "Deleting artifact: id=$id created=$created_at size=$size name=$name"
              gh api --method DELETE "/repos/$REPO/actions/artifacts/$id"
              deleted_artifacts=$((deleted_artifacts + 1))
              deleted_artifact_bytes=$((deleted_artifact_bytes + size))
            fi
          done < <(
            gh api --paginate "/repos/$REPO/actions/artifacts?per_page=100" \
              --jq '.artifacts[] | [.id, .created_at, .size_in_bytes, .name] | @tsv'
          )

          deleted_caches=0
          deleted_cache_bytes=0

          while IFS=$'\t' read -r id last_accessed_at size key; do
            [ -z "${id:-}" ] && continue
            accessed_epoch="$(date -u -d "$last_accessed_at" +%s)"
            if (( accessed_epoch < cutoff_epoch )); then
              echo "Deleting cache: id=$id last_accessed=$last_accessed_at size=$size key=$key"
              gh api --method DELETE "/repos/$REPO/actions/caches/$id"
              deleted_caches=$((deleted_caches + 1))
              deleted_cache_bytes=$((deleted_cache_bytes + size))
            fi
          done < <(
            gh api --paginate "/repos/$REPO/actions/caches?per_page=100" \
              --jq '.actions_caches[] | [.id, .last_accessed_at, .size_in_bytes, .key] | @tsv'
          )

          echo "SUMMARY deleted_artifacts=$deleted_artifacts artifact_bytes=$deleted_artifact_bytes deleted_caches=$deleted_caches cache_bytes=$deleted_cache_bytes"