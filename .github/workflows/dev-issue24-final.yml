name: dev-issue24-final

on:
  push:
    branches: [ dev/issue24-final ]
    paths:
      - '.github/workflows/dev-issue24-final.yml'

permissions:
  contents: write

jobs:
  harden-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Apply request-line hardening on accepted benchmark head
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $source = 'src/ProxyToAnyConnect/Proxy/ProxyServer.cs'
          $runner = 'tests/ProxyToAnyConnect.SelfTests/CombinedTestRunner.cs'
          if ((git rev-parse "HEAD:$source").Trim() -ne 'c8786b30c6b9454e43be3afdba0e0c08d7477ca0') { throw 'Unexpected ProxyServer blob.' }
          if ((git rev-parse "HEAD:$runner").Trim() -ne 'b9f4a666d7b16ecb2ec68f99159adebfa48a1cdc') { throw 'Unexpected runner blob.' }

          @'
          from pathlib import Path
          source = Path('src/ProxyToAnyConnect/Proxy/ProxyServer.cs')
          text = source.read_text(encoding='utf-8')
          old_uri = '''        if (!Uri.TryCreate(target, UriKind.Absolute, out var uri) ||
                      !uri.Scheme.Equals(Uri.UriSchemeHttp, StringComparison.OrdinalIgnoreCase) ||
                      string.IsNullOrWhiteSpace(uri.Host))'''
          new_uri = '''        if (!Uri.TryCreate(target, UriKind.Absolute, out var uri) ||
                      !uri.Scheme.Equals(Uri.UriSchemeHttp, StringComparison.OrdinalIgnoreCase) ||
                      string.IsNullOrWhiteSpace(uri.Host) ||
                      !string.IsNullOrEmpty(uri.Fragment) ||
                      !string.IsNullOrEmpty(uri.UserInfo))'''
          if text.count(old_uri) != 1: raise SystemExit('absolute URI anchor mismatch')
          text = text.replace(old_uri, new_uri)
          old_line = '''            var method = requestLine[requestParts[0]].ToString();
                      var target = requestLine[requestParts[1]].ToString();
                      var version = requestLine[requestParts[2]].ToString();
                      var offset = requestLineEnd + 2;'''
          new_line = '''            var methodSpan = requestLine[requestParts[0]];
                      var versionSpan = requestLine[requestParts[2]];
                      if (!IsValidHeaderName(methodSpan))
                      {
                          throw new InvalidDataException("Invalid HTTP method token.");
                      }

                      if (!versionSpan.SequenceEqual("HTTP/1.0".AsSpan()) &&
                          !versionSpan.SequenceEqual("HTTP/1.1".AsSpan()))
                      {
                          throw new InvalidDataException("Unsupported HTTP request version.");
                      }

                      var method = methodSpan.ToString();
                      var target = requestLine[requestParts[1]].ToString();
                      var version = versionSpan.ToString();
                      var offset = requestLineEnd + 2;'''
          if text.count(old_line) != 1: raise SystemExit('request-line anchor mismatch')
          source.write_text(text.replace(old_line, new_line), encoding='utf-8', newline='')

          runner = Path('tests/ProxyToAnyConnect.SelfTests/CombinedTestRunner.cs')
          rt = runner.read_text(encoding='utf-8')
          anchor = '        await RunAsync(nameof(ProxyHttpHeaderValueSelfTests), ProxyHttpHeaderValueSelfTests.RunAsync);\n'
          if rt.count(anchor) != 1: raise SystemExit('runner anchor mismatch')
          runner.write_text(rt.replace(anchor, anchor + '        await RunAsync(nameof(ProxyHttpRequestLineSelfTests), ProxyHttpRequestLineSelfTests.RunAsync);\n'), encoding='utf-8', newline='')
          '@ | python -

          git diff --check
          dotnet run --project tests/ProxyToAnyConnect.SelfTests/ProxyToAnyConnect.SelfTests.csproj --configuration Release
          git config user.name 'ProxyToAnyConnect CI'
          git config user.email 'actions@github.com'
          git add $source $runner
          git commit -m 'proxy: validate HTTP request line and absolute target'
          git push origin HEAD:refs/heads/dev/issue24-final
