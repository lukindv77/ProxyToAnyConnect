name: dev-issue27

on:
  push:
    branches: [ dev/issue27-vpn-helper-test ]
    paths:
      - '.github/workflows/dev-issue27.yml'

permissions:
  contents: write

jobs:
  stabilize-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Replace nested PowerShell child and run aggregate tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $test = 'tests/ProxyToAnyConnect.SelfTests/WindowsVpnProfileInspectorLifetimeSelfTests.cs'
          if ((git rev-parse "HEAD:$test").Trim() -ne '89d04cd8f54b49c9c9a093d7e5016411d8e4731c') {
            throw 'Unexpected VPN profile lifetime test blob.'
          }

          $text = Get-Content -LiteralPath $test -Raw
          $old = @'
            $child = Start-Process `
                -FilePath (Join-Path $PSHOME 'powershell.exe') `
                -ArgumentList @('-NoLogo','-NoProfile','-NonInteractive','-Command','Start-Sleep -Seconds 30') `
                -PassThru
'@
          $new = @'
            $child = Start-Process `
                -FilePath (Join-Path $env:SystemRoot 'System32\ping.exe') `
                -ArgumentList @('-n','31','127.0.0.1') `
                -PassThru
'@
          if (-not $text.Contains($old)) {
            throw 'Nested PowerShell child anchor was not found exactly once.'
          }
          $text = $text.Replace($old, $new)
          Set-Content -LiteralPath $test -Value $text -Encoding utf8 -NoNewline

          git diff --check
          $changed = @(git diff --name-only)
          if ($changed.Count -ne 1 -or $changed[0] -ne $test) {
            throw "Unexpected issue #27 patch: $($changed -join ', ')"
          }

          dotnet run --project tests/ProxyToAnyConnect.SelfTests/ProxyToAnyConnect.SelfTests.csproj --configuration Release

          git config user.name 'ProxyToAnyConnect CI'
          git config user.email 'actions@github.com'
          git add $test
          git commit -m 'test: use native child for PowerShell tree cancellation'
          git push origin HEAD:refs/heads/dev/issue27-vpn-helper-test
