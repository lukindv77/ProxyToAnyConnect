name: dev-issue49-probe-target

on:
  push:
    branches:
      - dev/issue49-probe-target
    paths:
      - .github/workflows/dev-issue49-probe-target.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Apply and verify issues 49 and 50 transform
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $expectedBase = '2e56f8f76efda9047ec83f3cd0e58aee395de322'
          git merge-base --is-ancestor $expectedBase HEAD

          if ((git rev-parse HEAD:.github/validation/issue49-transform.ps1).Trim() -ne '8986e4461c3a2098be6a4519b1b42e9ad124c7d5') {
            throw 'Unexpected issue49/50 transform blob.'
          }

          $expectedBlobs = [ordered]@{
            'src/ProxyToAnyConnect/Configuration/AppOptions.cs' = '961ed66e041be8a25aed146a287ae965585ff775'
            'src/ProxyToAnyConnect/Vpn/VpnConnectivityVerifier.cs' = '6f92dc81a29b1cefe38f37ad1af0bf8b9f620a4d'
            'tests/ProxyToAnyConnect.SelfTests/SettingsValidationSelfTests.cs' = '1e836fbd07361cedae256afca9ba74e5584f7ecf'
            'tests/ProxyToAnyConnect.SelfTests/VerificationProbeRequestSelfTests.cs' = '5e659b38f7e30e87ae1b28736d92e47e837a2709'
          }
          foreach ($entry in $expectedBlobs.GetEnumerator()) {
            $actual = (git rev-parse "HEAD:$($entry.Key)").Trim()
            if ($actual -ne $entry.Value) { throw "Unexpected base blob for $($entry.Key): $actual" }
          }

          & ./.github/validation/issue49-transform.ps1

          $requestTests = 'tests/ProxyToAnyConnect.SelfTests/VerificationProbeRequestSelfTests.cs'
          $text = [IO.File]::ReadAllText($requestTests).Replace("`r`n", "`n")
          $oldUsing = "using System.Diagnostics;`nusing System.Text;"
          $newUsing = "using System.Diagnostics;`nusing System.Text;`nusing ProxyToAnyConnect.Configuration;"
          if ([regex]::Matches($text, [regex]::Escape($oldUsing)).Count -ne 1) {
            throw 'Unexpected VerificationProbeRequestSelfTests using surface.'
          }
          [IO.File]::WriteAllText(
            $requestTests,
            $text.Replace($oldUsing, $newUsing),
            [Text.UTF8Encoding]::new($false))

          $appOptions = 'src/ProxyToAnyConnect/Configuration/AppOptions.cs'
          $appText = [IO.File]::ReadAllText($appOptions).Replace("`r`n", "`n")
          $asciiOld = @'
        if (isAscii)
        {
            if (Uri.CheckHostName(value) != UriHostNameType.Dns)
            {
                return false;
            }

            canonicalHost = value;
            return true;
        }
'@.TrimEnd("`r", "`n")
          $asciiNew = @'
        if (isAscii)
        {
            if (!IsValidAsciiDnsHost(value))
            {
                return false;
            }

            canonicalHost = value;
            return true;
        }
'@.TrimEnd("`r", "`n")
          if ([regex]::Matches($appText, [regex]::Escape($asciiOld)).Count -ne 1) {
            throw 'Unexpected ASCII verification-host validation surface.'
          }
          $appText = $appText.Replace($asciiOld, $asciiNew)

          $idnOld = @'
        if (Uri.CheckHostName(canonicalHost) != UriHostNameType.Dns ||
            canonicalHost.Any(character => character > 0x7f))
        {
            canonicalHost = string.Empty;
            return false;
        }

        return true;
    }

    internal static bool IsValidProbePath(string? value)
'@.TrimEnd("`r", "`n")
          $idnNew = @'
        if (!IsValidAsciiDnsHost(canonicalHost))
        {
            canonicalHost = string.Empty;
            return false;
        }

        return true;
    }

    private static bool IsValidAsciiDnsHost(string value)
    {
        if (value.Length is <= 0 or > 253 || value[^1] == '.')
        {
            return false;
        }

        var labelStart = 0;
        for (var index = 0; index <= value.Length; index++)
        {
            if (index != value.Length && value[index] != '.')
            {
                continue;
            }

            var labelLength = index - labelStart;
            if (labelLength is <= 0 or > 63 ||
                value[labelStart] == '-' ||
                value[index - 1] == '-')
            {
                return false;
            }

            for (var labelIndex = labelStart; labelIndex < index; labelIndex++)
            {
                var current = value[labelIndex];
                if (!((current >= 'A' && current <= 'Z') ||
                      (current >= 'a' && current <= 'z') ||
                      (current >= '0' && current <= '9') ||
                      current == '-'))
                {
                    return false;
                }
            }

            labelStart = index + 1;
        }

        return true;
    }

    internal static bool IsValidProbePath(string? value)
'@.TrimEnd("`r", "`n")
          if ([regex]::Matches($appText, [regex]::Escape($idnOld)).Count -ne 1) {
            throw 'Unexpected IDNA verification-host validation surface.'
          }
          [IO.File]::WriteAllText(
            $appOptions,
            $appText.Replace($idnOld, $idnNew),
            [Text.UTF8Encoding]::new($false))

          $expectedPaths = @($expectedBlobs.Keys | Sort-Object)
          git add -- $expectedPaths
          git config core.whitespace cr-at-eol
          git diff --cached --check
          $staged = @(git diff --cached --name-only | Sort-Object)
          if (($staged -join "`n") -ne ($expectedPaths -join "`n")) {
            throw "Unexpected #49/#50 staged surface: $($staged -join ', ')"
          }
      - name: Full aggregate self-tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          dotnet run --project tests/ProxyToAnyConnect.SelfTests/ProxyToAnyConnect.SelfTests.csproj --configuration Release
      - name: Publish validated verification source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'verification: canonicalize and validate probe wire inputs'
          git push origin HEAD:dev/issue49-probe-target