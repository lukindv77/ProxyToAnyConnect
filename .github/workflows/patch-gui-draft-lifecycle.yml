name: patch-gui-draft-lifecycle

on:
  push:
    branches: [ automation/gui-draft-lifecycle ]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply GUI draft and dialog lifetime changes
        shell: python
        run: |
          from pathlib import Path
          import base64
          import zlib

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if text.count(old) != 1:
                  raise SystemExit(f'Expected exact fragment once in {path}, found {text.count(old)}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          def write_z(path, payload):
              Path(path).write_bytes(zlib.decompress(base64.b64decode(payload)))

          write_z('src/ProxyToAnyConnect/Configuration/EditableConfigurationDraft.cs', '')
          write_z('tests/ProxyToAnyConnect.SelfTests/EditableConfigurationDraftSelfTests.cs', '')
          write_z('tests/ProxyToAnyConnect.SelfTests/L2tpSettingsDialogBackgroundSelfTests.cs', '')

          replace_once('src/ProxyToAnyConnect/Gui/MainForm.cs', '    private AppOptions _options;\n    private bool _allowExit;', '    private readonly EditableConfigurationDraft _configurationDraft;\n    private AppOptions _options => _configurationDraft.Current;\n    private bool _allowExit;')
          replace_once('src/ProxyToAnyConnect/Gui/MainForm.cs', '        _options = options;\n        _configPath = configPath;', '        _configurationDraft = new EditableConfigurationDraft(options);\n        _configPath = configPath;')
          replace_once('src/ProxyToAnyConnect/Gui/MainForm.cs', '        SetLabelText(\n            _configurationStatus,\n            string.IsNullOrWhiteSpace(_runtimeHost.ConfigurationError)\n                ? "Конфигурация runtime: OK"\n                : $"Конфигурация runtime: {_runtimeHost.ConfigurationError}");', '        var draftStatus = _configurationDraft.ValidationError is { Length: > 0 } draftError\n            ? _configurationDraft.HasUnpersistedChanges\n                ? $"Черновик настроек не сохранён: {draftError}"\n                : $"Сохранённая конфигурация требует исправления: {draftError}"\n            : _configurationDraft.HasUnpersistedChanges\n                ? "Черновик настроек валиден, но ещё не сохранён/не применён."\n                : null;\n        SetLabelText(\n            _configurationStatus,\n            draftStatus ?? (string.IsNullOrWhiteSpace(_runtimeHost.ConfigurationError)\n                ? "Конфигурация runtime: OK"\n                : $"Конфигурация runtime: {_runtimeHost.ConfigurationError}"));')
          replace_once('src/ProxyToAnyConnect/Gui/MainForm.cs', '    private async Task ApplyConfigurationAsync(\n        AppOptions newOptions,\n        CancellationToken cancellationToken)\n    {\n        var persisted = false;', '    private async Task ApplyConfigurationAsync(\n        AppOptions newOptions,\n        CancellationToken cancellationToken,\n        bool configureLoggingAfterPersist = false)\n    {\n        // Retain every editor result as the next repair base, but never publish an\n        // invalid accumulated generation.\n        if (!_configurationDraft.Stage(newOptions))\n        {\n            RebuildVpnNameIndex();\n            if (Volatile.Read(ref _configurationCommandsStopping) == 0)\n            {\n                RefreshRuntimeViews();\n                MessageBox.Show(\n                    this,\n                    "Изменение сохранено только в черновике окна. Файл настроек и runtime не изменены.\\n\\n" +\n                    $"Исправьте оставшуюся ошибку: {_configurationDraft.ValidationError}",\n                    "Черновик настроек требует исправления",\n                    MessageBoxButtons.OK,\n                    MessageBoxIcon.Warning);\n            }\n            return;\n        }\n\n        var persisted = false;')
          replace_once('src/ProxyToAnyConnect/Gui/MainForm.cs', '                desired =>\n                {\n                    _options = desired;\n                    RebuildVpnNameIndex();\n                    persisted = true;\n                },', '                desired =>\n                {\n                    _configurationDraft.MarkPersisted(desired);\n                    RebuildVpnNameIndex();\n                    if (configureLoggingAfterPersist)\n                    {\n                        AppLog.Configure(desired.Logging);\n                    }\n                    persisted = true;\n                },')
          replace_once('src/ProxyToAnyConnect/Gui/MainForm.cs', '            if (persisted && Volatile.Read(ref _configurationCommandsStopping) == 0)\n            {\n                // Show the persisted desired settings through subsequent editors and\n                // refresh current runtime/Error state even when reconciliation failed.\n                RefreshRuntimeViews();\n            }', '            if (Volatile.Read(ref _configurationCommandsStopping) == 0)\n            {\n                RefreshRuntimeViews();\n                if (persisted && configureLoggingAfterPersist)\n                {\n                    RefreshLoggingSettings();\n                }\n            }')
          replace_once('src/ProxyToAnyConnect/Gui/MainForm.cs', '        try\n        {\n            await newOptions.SaveAsync(_configPath, cancellationToken);\n            _options = newOptions;\n            AppLog.Configure(newLogging);\n            if (Volatile.Read(ref _configurationCommandsStopping) == 0)\n            {\n                RefreshLoggingSettings();\n            }\n        }\n        catch (OperationCanceledException) when (cancellationToken.IsCancellationRequested)\n        {\n        }\n        catch (Exception ex)\n        {\n            MessageBox.Show(this, ex.Message, "Не удалось сохранить настройки", MessageBoxButtons.OK, MessageBoxIcon.Error);\n        }', '        // Logging may be the final repair that validates an accumulated topology\n        // draft, so persist and reconcile the complete current generation.\n        await ApplyConfigurationAsync(\n            newOptions,\n            cancellationToken,\n            configureLoggingAfterPersist: true);')

          replace_once('src/ProxyToAnyConnect/Gui/L2tpSettingsDialog.cs', '    private readonly L2tpOptions? _existing;\n    private readonly WindowsVpnProfileInspector _profileInspector = new();\n    private CancellationTokenSource? _profileLoadCancellation;', '    private readonly L2tpOptions? _existing;\n    private readonly Func<CancellationToken, Task<IReadOnlyList<VpnProfileInfo>>> _profileLoader;\n    private CancellationTokenSource? _profileLoadCancellation;')
          replace_once('src/ProxyToAnyConnect/Gui/L2tpSettingsDialog.cs', '    public L2tpSettingsDialog(L2tpOptions? existing)\n    {\n        _existing = existing;', '    public L2tpSettingsDialog(L2tpOptions? existing)\n        : this(existing, null)\n    {\n    }\n\n    internal L2tpSettingsDialog(\n        L2tpOptions? existing,\n        Func<CancellationToken, Task<IReadOnlyList<VpnProfileInfo>>>? profileLoader)\n    {\n        _existing = existing;\n        _profileLoader = profileLoader ?? new WindowsVpnProfileInspector().ListL2tpProfilesAsync;')
          replace_once('src/ProxyToAnyConnect/Gui/L2tpSettingsDialog.cs', '    private void StartWindowsProfileLoad()', '    internal void StartWindowsProfileLoad()')
          replace_once('src/ProxyToAnyConnect/Gui/L2tpSettingsDialog.cs', '            var profiles = await _profileInspector.ListL2tpProfilesAsync(cancellation.Token);', '            var profiles = await _profileLoader(cancellation.Token);')

          replace_once('tests/ProxyToAnyConnect.SelfTests/CombinedTestRunner.cs', '        Run(nameof(SettingsValidationSelfTests), SettingsValidationSelfTests.Run);\n', '        Run(nameof(SettingsValidationSelfTests), SettingsValidationSelfTests.Run);\n        Run(nameof(EditableConfigurationDraftSelfTests), EditableConfigurationDraftSelfTests.Run);\n')
          replace_once('tests/ProxyToAnyConnect.SelfTests/CombinedTestRunner.cs', '        await RunAsync(nameof(ConfigurationDialogOwnerSelfTests), ConfigurationDialogOwnerSelfTests.RunAsync);\n', '        await RunAsync(nameof(ConfigurationDialogOwnerSelfTests), ConfigurationDialogOwnerSelfTests.RunAsync);\n        await RunAsync(nameof(L2tpSettingsDialogBackgroundSelfTests), L2tpSettingsDialogBackgroundSelfTests.RunAsync);\n')
          replace_once('tests/ProxyToAnyConnect.SelfTests/CombinedTestRunner.cs', 'bounded-settings/secret-pruning, configuration-persistence', 'bounded-settings/secret-pruning/editable-draft-repair, configuration-persistence')
          replace_once('tests/ProxyToAnyConnect.SelfTests/CombinedTestRunner.cs', 'GUI-modal-ownership/application-shutdown-ordering', 'GUI-modal-ownership/L2TP-dialog-helper-drain/application-shutdown-ordering')

      - name: Commit feature changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/patch-gui-draft-lifecycle.yml
          git add src tests
          git diff --cached --check
          git commit -m 'feat: preserve sequential GUI repair drafts and helper ownership'
          git push origin HEAD:automation/gui-draft-lifecycle
