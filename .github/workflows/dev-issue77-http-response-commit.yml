name: dev-issue77-http-response-commit

on:
  push:
    branches:
      - dev/issue77-http-response-commit
    paths:
      - .github/workflows/dev-issue77-http-response-commit.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Apply and verify issue 77 transform
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $expectedBase = '7223e7ac0824ff4deab4417fb297f1b651d0a1c2'
          git merge-base --is-ancestor $expectedBase HEAD

          $expectedProxyBlob = '9b4557dbd4956db48c2879f714abe17b9b914004'
          $expectedRunnerBlob = '340d49a960a87154621b4556a83df2cf80aba204'
          $expectedTransformBlob = '9b8ce6f4ce71ee1124f80f5749c96234fbd53f1c'
          $expectedPostTransformBlob = 'e61b80a283a32dda37003fa04caf97ea8c336ff4'
          $expectedTestBlob = 'd0dcf1466c77d4297cb85863a49be5f35df8f84e'

          if ((git rev-parse "$expectedBase`:src/ProxyToAnyConnect/Proxy/ProxyServer.cs").Trim() -ne $expectedProxyBlob) {
            throw 'Unexpected #77 base ProxyServer blob.'
          }
          if ((git rev-parse "$expectedBase`:tests/ProxyToAnyConnect.SelfTests/CombinedTestRunner.cs").Trim() -ne $expectedRunnerBlob) {
            throw 'Unexpected #77 base CombinedTestRunner blob.'
          }
          if ((git rev-parse 'HEAD:.github/validation/issue77-transform.ps1').Trim() -ne $expectedTransformBlob) {
            throw 'Unexpected #77 transform blob.'
          }
          if ((git rev-parse 'HEAD:.github/validation/issue77-post-transform.ps1').Trim() -ne $expectedPostTransformBlob) {
            throw 'Unexpected #77 post-transform blob.'
          }
          if ((git rev-parse 'HEAD:tests/ProxyToAnyConnect.SelfTests/ProxyHttpResponseCommitBoundarySelfTests.cs').Trim() -ne $expectedTestBlob) {
            throw 'Unexpected #77 regression-test blob.'
          }

          $expectedBranchSurface = @(
            '.github/validation/issue77-transform.ps1'
            '.github/validation/issue77-post-transform.ps1'
            '.github/workflows/dev-issue77-http-response-commit.yml'
            'tests/ProxyToAnyConnect.SelfTests/ProxyHttpResponseCommitBoundarySelfTests.cs'
          ) | Sort-Object
          $branchSurface = @(git diff --name-only "$expectedBase...HEAD" | Sort-Object)
          if (($branchSurface -join "`n") -ne ($expectedBranchSurface -join "`n")) {
            throw "Unexpected #77 pre-transform branch surface: $($branchSurface -join ', ')"
          }

          & ./.github/validation/issue77-transform.ps1
          & ./.github/validation/issue77-post-transform.ps1

          git add -- `
            src/ProxyToAnyConnect/Proxy/ProxyServer.cs `
            tests/ProxyToAnyConnect.SelfTests/CombinedTestRunner.cs
          git config core.whitespace cr-at-eol
          git diff --cached --check

          $expectedStaged = @(
            'src/ProxyToAnyConnect/Proxy/ProxyServer.cs'
            'tests/ProxyToAnyConnect.SelfTests/CombinedTestRunner.cs'
          ) | Sort-Object
          $staged = @(git diff --cached --name-only | Sort-Object)
          if (($staged -join "`n") -ne ($expectedStaged -join "`n")) {
            throw "Unexpected #77 staged surface: $($staged -join ', ')"
          }
      - name: Full aggregate self-tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          dotnet run --project tests/ProxyToAnyConnect.SelfTests/ProxyToAnyConnect.SelfTests.csproj --configuration Release
      - name: Publish validated issue 77 source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'proxy: enforce plain HTTP response commit boundary'
          git push origin HEAD:dev/issue77-http-response-commit
