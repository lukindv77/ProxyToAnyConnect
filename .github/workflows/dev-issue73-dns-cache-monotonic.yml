name: dev-issue73-dns-cache-monotonic

on:
  push:
    branches:
      - dev/issue73-dns-cache-monotonic
    paths:
      - .github/workflows/dev-issue73-dns-cache-monotonic.yml
      - src/ProxyToAnyConnect/Network/L2tpDnsCache.cs
      - tests/ProxyToAnyConnect.SelfTests/DnsCacheSelfTests.cs

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Verify issue 73 source surface
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $expectedBase = '9e306a02f50166cd3a6ef83996a0f84ee4d7cbf1'
          git merge-base --is-ancestor $expectedBase HEAD
          git config core.whitespace cr-at-eol
          git diff --check "$expectedBase...HEAD"

          $expectedPaths = @(
            '.github/workflows/dev-issue73-dns-cache-monotonic.yml'
            'src/ProxyToAnyConnect/Network/L2tpDnsCache.cs'
            'tests/ProxyToAnyConnect.SelfTests/DnsCacheSelfTests.cs'
          ) | Sort-Object
          $changed = @(git diff --name-only "$expectedBase...HEAD" | Sort-Object)
          if (($changed -join "`n") -ne ($expectedPaths -join "`n")) {
            throw "Unexpected #73 branch surface: $($changed -join ', ')"
          }
      - name: Full aggregate self-tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          dotnet run --project tests/ProxyToAnyConnect.SelfTests/ProxyToAnyConnect.SelfTests.csproj --configuration Release
