name: dev-issue47-soak-duration

on:
  push:
    branches:
      - dev/issue47-soak-duration
    paths:
      - .github/workflows/dev-issue47-soak-duration.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Diagnose serialized soak timestamp span
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $process = Get-Process -Id $PID
          $process.Refresh()
          $hash = (Get-FileHash -LiteralPath $process.Path -Algorithm SHA256).Hash.ToLowerInvariant()
          $output = './artifacts/issue47-diagnostic'
          ./tools/Invoke-WindowsSoakEvidence.ps1 `
            -ProcessId $PID `
            -ExpectedProcessName $process.ProcessName `
            -ExpectedExecutableSha256 $hash `
            -DurationSeconds 2 `
            -SampleIntervalSeconds 1 `
            -OutputDirectory $output | Out-Null

          $summary = Get-Content -LiteralPath (Join-Path $output 'summary.json') -Raw | ConvertFrom-Json
          $lines = @(Get-Content -LiteralPath (Join-Path $output 'process-samples.jsonl'))
          $first = $lines[0] | ConvertFrom-Json
          $last = $lines[-1] | ConvertFrom-Json
          Write-Host "SUMMARY=$($summary.observedDurationSeconds)"
          Write-Host "FIRST_RAW=$($lines[0])"
          Write-Host "LAST_RAW=$($lines[-1])"
          Write-Host "FIRST_TYPE=$($first.timestampUtc.GetType().FullName) VALUE=$($first.timestampUtc)"
          Write-Host "LAST_TYPE=$($last.timestampUtc.GetType().FullName) VALUE=$($last.timestampUtc)"
          $coercedSpan = ([DateTimeOffset]::Parse([string]$last.timestampUtc) - [DateTimeOffset]::Parse([string]$first.timestampUtc)).TotalSeconds
          Write-Host "COERCED_SPAN=$coercedSpan"

          $firstDoc = [System.Text.Json.JsonDocument]::Parse($lines[0])
          $lastDoc = [System.Text.Json.JsonDocument]::Parse($lines[-1])
          try {
            $firstRawTimestamp = $firstDoc.RootElement.GetProperty('timestampUtc').GetString()
            $lastRawTimestamp = $lastDoc.RootElement.GetProperty('timestampUtc').GetString()
          }
          finally {
            $firstDoc.Dispose()
            $lastDoc.Dispose()
          }
          $rawSpan = ([DateTimeOffset]::ParseExact($lastRawTimestamp, 'O', [Globalization.CultureInfo]::InvariantCulture) - [DateTimeOffset]::ParseExact($firstRawTimestamp, 'O', [Globalization.CultureInfo]::InvariantCulture)).TotalSeconds
          Write-Host "RAW_FIRST=$firstRawTimestamp"
          Write-Host "RAW_LAST=$lastRawTimestamp"
          Write-Host "RAW_SPAN=$rawSpan"

          $failedAsExpected = $false
          try {
            ./tools/Test-WindowsSoakEvidence.ps1 `
              -OutputDirectory $output `
              -ExpectedExecutableSha256 $hash `
              -MinimumSamples 2 `
              -MinimumObservedDurationSeconds 1 | Out-Null
          }
          catch {
            $failedAsExpected = $true
            Write-Host "CURRENT_VALIDATOR_FAILURE=$($_.Exception.Message)"
          }
          if (-not $failedAsExpected) {
            Write-Host 'CURRENT_VALIDATOR_ACCEPTED=true'
          }
