name: dev-issue79-outbound-timeout-v2

on:
  push:
    branches:
      - dev/issue79-outbound-timeout-v2
    paths:
      - .github/workflows/dev-issue79-outbound-timeout-v2.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Apply and verify redesigned issue 79 transform
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $expectedBase = 'befadd69d02111902c4e9bc33e6f1baaddf12fec'
          git merge-base --is-ancestor $expectedBase HEAD

          $expected = @{
            'src/ProxyToAnyConnect/Network/IProxyOutboundConnectionFactory.cs' = '93edabc4107210d8499729c7a0140cb24320fb98'
            'src/ProxyToAnyConnect/Network/L2tpSocketFactory.cs' = 'd49bb184a7e143fa70c78a4b59df65a4a887c988'
            'src/ProxyToAnyConnect/Proxy/ProxyServer.cs' = 'ebae55546d38eb939d542562c2e5267c8d99b3da'
            'tests/ProxyToAnyConnect.SelfTests/CombinedTestRunner.cs' = '3fd222b1c674f2028b8f645c0441d5532f4708b7'
          }
          foreach ($entry in $expected.GetEnumerator()) {
            if ((git rev-parse "$expectedBase`:$($entry.Key)").Trim() -ne $entry.Value) { throw "Unexpected #79 v2 base blob: $($entry.Key)" }
          }
          if ((git rev-parse 'HEAD:.github/validation/issue79-v2-transform.ps1').Trim() -ne '3b40b518def9e2cb2715c588d95b32ed7aec5eac') { throw 'Unexpected #79 v2 transform blob.' }
          if ((git rev-parse 'HEAD:tests/ProxyToAnyConnect.SelfTests/ProxyOutboundTimeoutSelfTests.cs').Trim() -ne '24cfc20f4607860ded2e5b5cd0d9030d9880b86a') { throw 'Unexpected #79 v2 regression-test blob.' }

          $expectedSurface = @(
            '.github/validation/issue79-v2-transform.ps1'
            '.github/workflows/dev-issue79-outbound-timeout-v2.yml'
            'tests/ProxyToAnyConnect.SelfTests/ProxyOutboundTimeoutSelfTests.cs'
          ) | Sort-Object
          $surface = @(git diff --name-only "$expectedBase...HEAD" | Sort-Object)
          if (($surface -join "`n") -ne ($expectedSurface -join "`n")) { throw "Unexpected #79 v2 branch surface: $($surface -join ', ')" }

          & ./.github/validation/issue79-v2-transform.ps1
          git add -- `
            src/ProxyToAnyConnect/Network/IProxyOutboundConnectionFactory.cs `
            src/ProxyToAnyConnect/Network/L2tpSocketFactory.cs `
            src/ProxyToAnyConnect/Proxy/ProxyServer.cs `
            tests/ProxyToAnyConnect.SelfTests/CombinedTestRunner.cs
          git config core.whitespace cr-at-eol
          git diff --cached --check
          $expectedStaged = @(
            'src/ProxyToAnyConnect/Network/IProxyOutboundConnectionFactory.cs'
            'src/ProxyToAnyConnect/Network/L2tpSocketFactory.cs'
            'src/ProxyToAnyConnect/Proxy/ProxyServer.cs'
            'tests/ProxyToAnyConnect.SelfTests/CombinedTestRunner.cs'
          ) | Sort-Object
          $staged = @(git diff --cached --name-only | Sort-Object)
          if (($staged -join "`n") -ne ($expectedStaged -join "`n")) { throw "Unexpected #79 v2 staged surface: $($staged -join ', ')" }
      - name: Full aggregate self-tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          dotnet run --project tests/ProxyToAnyConnect.SelfTests/ProxyToAnyConnect.SelfTests.csproj --configuration Release
      - name: Publish redesigned validated source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'proxy: enforce outbound deadline with VPN precedence'
          git push origin HEAD:dev/issue79-outbound-timeout-v2
