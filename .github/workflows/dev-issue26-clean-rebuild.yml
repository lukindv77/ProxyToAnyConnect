name: dev-issue26-clean-rebuild

on:
  push:
    branches: [ dev/issue26-clean-rebuild ]
    paths:
      - '.github/workflows/dev-issue26-clean-rebuild.yml'
      - '.github/scripts/dev-issue26-clean.py'

permissions:
  contents: write

jobs:
  validate-and-publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Apply strict Connection option grammar
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          python .github/scripts/dev-issue26-clean.py
          git diff --check
          $changed = @(git diff --name-only)
          $expected = @(
            'src/ProxyToAnyConnect/Proxy/ProxyServer.cs',
            'tests/ProxyToAnyConnect.SelfTests/CombinedTestRunner.cs'
          )
          if ($changed.Count -ne $expected.Count) {
            throw "Unexpected #26 patch count: $($changed -join ', ')"
          }
          foreach ($path in $expected) {
            if ($changed -notcontains $path) {
              throw "#26 patch omitted expected path: $path"
            }
          }
      - name: Run full aggregate self-tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          dotnet run --project tests/ProxyToAnyConnect.SelfTests/ProxyToAnyConnect.SelfTests.csproj --configuration Release
      - name: Publish validated Connection option sources
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          git config user.name 'ProxyToAnyConnect CI'
          git config user.email 'actions@github.com'
          git add src/ProxyToAnyConnect/Proxy/ProxyServer.cs tests/ProxyToAnyConnect.SelfTests/CombinedTestRunner.cs tests/ProxyToAnyConnect.SelfTests/ProxyConnectionOptionSelfTests.cs
          git commit -m 'proxy: validate Connection options before outbound routing'
          git push origin HEAD:refs/heads/dev/issue26-clean-rebuild
