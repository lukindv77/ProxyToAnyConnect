name: dev-issue88-verification-grammar

on:
  push:
    branches:
      - dev/issue88-verification-grammar
    paths:
      - .github/workflows/dev-issue88-verification-grammar.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Apply and verify issue 88 transform
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $expectedBase = '4437e8df614271d8e2fd666979dab6a3e85c803c'
          git merge-base --is-ancestor $expectedBase HEAD

          $expected = @{
            'src/ProxyToAnyConnect/Vpn/VpnConnectivityVerifier.cs' = '238cdbf6c0af2b8f9d0dc46c964436a36a0dbf1c'
            'tests/ProxyToAnyConnect.SelfTests/VerificationChunkedDecodeSelfTests.cs' = '9f444539bd64d2f8b181a12159563d8ae0aff656'
            'tests/ProxyToAnyConnect.SelfTests/VerificationHttpParserTests.cs' = 'ee839371da303ea7ad246a4eeff70049286ae295'
          }
          foreach ($entry in $expected.GetEnumerator()) {
            if ((git rev-parse "$expectedBase`:$($entry.Key)").Trim() -ne $entry.Value) {
              throw "Unexpected #88 base blob: $($entry.Key)"
            }
          }
          if ((git rev-parse 'HEAD:.github/validation/issue88-transform.ps1').Trim() -ne 'd7679f7098cdbf4d2876cd6071050181ac511d51') {
            throw 'Unexpected #88 primary transform blob.'
          }
          if ((git rev-parse 'HEAD:.github/validation/issue88-finalize-transform.ps1').Trim() -ne '47f0bd84c76839f7b252fe219baa5d0f30d7f6be') {
            throw 'Unexpected #88 finalizer transform blob.'
          }

          $expectedSurface = @(
            '.github/validation/issue88-transform.ps1'
            '.github/validation/issue88-finalize-transform.ps1'
            '.github/workflows/dev-issue88-verification-grammar.yml'
          ) | Sort-Object
          $surface = @(git diff --name-only "$expectedBase...HEAD" | Sort-Object)
          if (($surface -join "`n") -ne ($expectedSurface -join "`n")) {
            throw "Unexpected #88 branch surface: $($surface -join ', ')"
          }

          try {
            & ./.github/validation/issue88-transform.ps1
            throw 'Issue 88 primary transform unexpectedly passed its deliberately superseded HTTP-test anchor.'
          }
          catch {
            if ($_.Exception.Message -ne 'Missing missing status separator regression anchor.') {
              throw
            }
          }
          & ./.github/validation/issue88-finalize-transform.ps1

          git add -- `
            src/ProxyToAnyConnect/Vpn/VpnConnectivityVerifier.cs `
            tests/ProxyToAnyConnect.SelfTests/VerificationChunkedDecodeSelfTests.cs `
            tests/ProxyToAnyConnect.SelfTests/VerificationHttpParserTests.cs
          git config core.whitespace cr-at-eol
          git diff --cached --check

          $expectedStaged = @(
            'src/ProxyToAnyConnect/Vpn/VpnConnectivityVerifier.cs'
            'tests/ProxyToAnyConnect.SelfTests/VerificationChunkedDecodeSelfTests.cs'
            'tests/ProxyToAnyConnect.SelfTests/VerificationHttpParserTests.cs'
          ) | Sort-Object
          $staged = @(git diff --cached --name-only | Sort-Object)
          if (($staged -join "`n") -ne ($expectedStaged -join "`n")) {
            throw "Unexpected #88 staged surface: $($staged -join ', ')"
          }
      - name: Build release
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          dotnet build ProxyToAnyConnect.sln -c Release
      - name: Full aggregate self-tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          dotnet run --project tests/ProxyToAnyConnect.SelfTests/ProxyToAnyConnect.SelfTests.csproj --configuration Release --no-build
      - name: Publish validated issue 88 source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'verification: enforce chunk and status grammar'
          git push origin HEAD:dev/issue88-verification-grammar
