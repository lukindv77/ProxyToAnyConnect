name: one-shot-l2tp-shutdown-fix

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply exact shutdown ownership patch
        shell: python
        run: |
          from pathlib import Path

          l2tp = Path('src/ProxyToAnyConnect/Gui/L2tpSettingsDialog.cs')
          text = l2tp.read_text(encoding='utf-8')
          old = '''    private static void SelectEnum<TEnum>(ComboBox combo, TEnum value)\n    {\n        where TEnum : struct, Enum\n        for (var index = 0; index < combo.Items.Count; index++)\n'''
          new = '''    private static void SelectEnum<TEnum>(ComboBox combo, TEnum value)\n        where TEnum : struct, Enum\n    {\n        for (var index = 0; index < combo.Items.Count; index++)\n'''
          if old not in text:
              raise SystemExit('Expected broken SelectEnum generic constraint was not found exactly once.')
          if text.count(old) != 1:
              raise SystemExit('Broken SelectEnum generic constraint was not unique.')
          l2tp.write_text(text.replace(old, new, 1), encoding='utf-8')

          main = Path('src/ProxyToAnyConnect/Gui/MainForm.cs')
          text = main.read_text(encoding='utf-8')
          replacements = [
              (
                  '''        using var dialog = new L2tpSettingsDialog(null);\n        if (_configurationDialogs.Run(dialog, this) != DialogResult.OK)\n        {\n            return;\n        }\n\n        cancellationToken.ThrowIfCancellationRequested();\n''',
                  '''        using var dialog = new L2tpSettingsDialog(null);\n        var dialogResult = _configurationDialogs.Run(dialog, this);\n        await dialog.StopBackgroundOperationsAsync();\n        if (dialogResult != DialogResult.OK)\n        {\n            return;\n        }\n\n        cancellationToken.ThrowIfCancellationRequested();\n'''
              ),
              (
                  '''        using var dialog = new L2tpSettingsDialog(existing);\n        if (_configurationDialogs.Run(dialog, this) != DialogResult.OK)\n        {\n            return;\n        }\n\n        cancellationToken.ThrowIfCancellationRequested();\n''',
                  '''        using var dialog = new L2tpSettingsDialog(existing);\n        var dialogResult = _configurationDialogs.Run(dialog, this);\n        await dialog.StopBackgroundOperationsAsync();\n        if (dialogResult != DialogResult.OK)\n        {\n            return;\n        }\n\n        cancellationToken.ThrowIfCancellationRequested();\n'''
              )
          ]
          for old, new in replacements:
              if text.count(old) != 1:
                  raise SystemExit('Expected MainForm L2TP dialog ownership fragment was not found exactly once.')
              text = text.replace(old, new, 1)
          main.write_text(text, encoding='utf-8')

      - name: Commit source patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/ProxyToAnyConnect/Gui/L2tpSettingsDialog.cs src/ProxyToAnyConnect/Gui/MainForm.cs
          git diff --cached --check
          git commit -m 'fix: complete L2TP profile helper shutdown barrier'
          git push origin HEAD:main
