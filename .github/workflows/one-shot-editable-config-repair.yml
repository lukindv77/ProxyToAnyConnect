name: one-shot-editable-config-repair

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/one-shot-editable-config-repair.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply staged-draft GUI patch and regression
        shell: python
        run: |
          from pathlib import Path

          main = Path('src/ProxyToAnyConnect/Gui/MainForm.cs')
          text = main.read_text(encoding='utf-8')

          replacements = [
              (
                  '''    private int _configurationCommandsStopping;\n''',
                  '''    private int _configurationCommandsStopping;\n    private string? _configurationDraftStatus;\n'''
              ),
              (
                  '''        SetLabelText(\n            _configurationStatus,\n            string.IsNullOrWhiteSpace(_runtimeHost.ConfigurationError)\n                ? "Конфигурация runtime: OK"\n                : $"Конфигурация runtime: {_runtimeHost.ConfigurationError}");\n''',
                  '''        var runtimeConfigurationError = _runtimeHost.ConfigurationError;\n        SetLabelText(\n            _configurationStatus,\n            string.IsNullOrWhiteSpace(_configurationDraftStatus)\n                ? string.IsNullOrWhiteSpace(runtimeConfigurationError)\n                    ? "Конфигурация: сохранена, runtime: OK"\n                    : $"Конфигурация сохранена; runtime: {runtimeConfigurationError}"\n                : string.IsNullOrWhiteSpace(runtimeConfigurationError)\n                    ? _configurationDraftStatus\n                    : $"{_configurationDraftStatus} | runtime: {runtimeConfigurationError}");\n'''
              ),
              (
                  '''    private async Task ApplyConfigurationAsync(\n        AppOptions newOptions,\n        CancellationToken cancellationToken)\n    {\n        var persisted = false;\n        try\n        {\n            await PersistedDesiredConfiguration.SaveThenApplyAsync(\n                newOptions,\n                (desired, operationToken) => desired.SaveAsync(_configPath, operationToken),\n                desired =>\n                {\n                    _options = desired;\n                    RebuildVpnNameIndex();\n                    persisted = true;\n                },\n                (desired, operationToken) => _runtimeHost.ApplyOptionsAsync(desired, operationToken),\n                cancellationToken);\n        }\n        catch (OperationCanceledException) when (cancellationToken.IsCancellationRequested)\n        {\n            // Exit cancellation may arrive before publication or after durable save.\n            // In the latter case the persisted desired state remains authoritative and\n            // will be reconciled on the next application start.\n        }\n        catch (Exception ex)\n        {\n            MessageBox.Show(\n                this,\n                ex.Message,\n                persisted\n                    ? "Настройки сохранены, runtime не применён"\n                    : "Не удалось применить настройки",\n                MessageBoxButtons.OK,\n                MessageBoxIcon.Error);\n        }\n        finally\n        {\n            if (persisted && Volatile.Read(ref _configurationCommandsStopping) == 0)\n            {\n                // Show the persisted desired settings through subsequent editors and\n                // refresh current runtime/Error state even when reconciliation failed.\n                RefreshRuntimeViews();\n            }\n        }\n    }\n''',
                  '''    private async Task ApplyConfigurationAsync(\n        AppOptions newOptions,\n        CancellationToken cancellationToken)\n    {\n        var staged = false;\n        var persisted = false;\n        try\n        {\n            var result = await EditableConfigurationWorkflow.StageValidateSaveApplyAsync(\n                newOptions,\n                desired =>\n                {\n                    _options = desired;\n                    RebuildVpnNameIndex();\n                    staged = true;\n                    _configurationDraftStatus = "Черновик конфигурации не сохранён.";\n                },\n                (desired, operationToken) => desired.SaveAsync(_configPath, operationToken),\n                desired =>\n                {\n                    _options = desired;\n                    RebuildVpnNameIndex();\n                    persisted = true;\n                    _configurationDraftStatus = null;\n                },\n                ApplyPersistedConfigurationAsync,\n                cancellationToken);\n\n            if (!result.IsGloballyValid)\n            {\n                _configurationDraftStatus =\n                    $"Черновик конфигурации не сохранён: {result.ValidationError}";\n\n                if (Volatile.Read(ref _configurationCommandsStopping) == 0)\n                {\n                    MessageBox.Show(\n                        this,\n                        "Изменение оставлено в редактируемом черновике, но appsettings.json и runtime не изменены. " +\n                        $"Исправьте оставшуюся ошибку конфигурации: {result.ValidationError}",\n                        "Требуется дальнейшее исправление конфигурации",\n                        MessageBoxButtons.OK,\n                        MessageBoxIcon.Warning);\n                }\n\n                return;\n            }\n        }\n        catch (OperationCanceledException) when (cancellationToken.IsCancellationRequested)\n        {\n            // Exit cancellation may arrive before staging, before durable publication\n            // or after save. An already-staged but not-yet-persisted generation remains\n            // only in this closing UI process; the last complete on-disk generation is\n            // untouched and is authoritative on the next start.\n            if (staged && !persisted)\n            {\n                _configurationDraftStatus = "Черновик конфигурации не сохранён: операция отменена.";\n            }\n        }\n        catch (Exception ex)\n        {\n            if (staged && !persisted)\n            {\n                _configurationDraftStatus = $"Черновик конфигурации не сохранён: {ex.Message}";\n            }\n\n            if (Volatile.Read(ref _configurationCommandsStopping) == 0)\n            {\n                MessageBox.Show(\n                    this,\n                    ex.Message,\n                    persisted\n                        ? "Настройки сохранены, runtime не применён"\n                        : staged\n                            ? "Изменения оставлены в черновике, но не сохранены"\n                            : "Не удалось применить настройки",\n                    MessageBoxButtons.OK,\n                    MessageBoxIcon.Error);\n            }\n        }\n        finally\n        {\n            if (staged && Volatile.Read(ref _configurationCommandsStopping) == 0)\n            {\n                // Always project the newest editable generation, even when another\n                // independent defect still prevents persistence. This is what makes\n                // multi-error legacy configuration repair possible without restart.\n                RefreshRuntimeViews();\n                RefreshLoggingSettings();\n            }\n        }\n    }\n\n    private async Task ApplyPersistedConfigurationAsync(\n        AppOptions desired,\n        CancellationToken cancellationToken)\n    {\n        // Logging and runtime are independent consumers of the one durable desired\n        // generation. Configure logging first (fail-soft by contract), then reconcile\n        // runtime. A runtime failure does not roll back the already-saved file.\n        AppLog.Configure(desired.Logging);\n        await _runtimeHost.ApplyOptionsAsync(desired, cancellationToken);\n    }\n'''
              ),
              (
                  '''    private async Task SaveLoggingSettingsAsync(\n        LoggingOptions newLogging,\n        CancellationToken cancellationToken)\n    {\n        // This method runs only inside the serialized configuration command queue.\n        // Merge the captured log request with the latest persisted desired topology\n        // so an earlier proxy/VPN generation cannot be overwritten by a stale full\n        // AppOptions snapshot from a later log-only save.\n        var newOptions = new AppOptions\n        {\n            Proxies = _options.Proxies,\n            VpnConnections = _options.VpnConnections,\n            Logging = newLogging\n        };\n\n        try\n        {\n            await newOptions.SaveAsync(_configPath, cancellationToken);\n            _options = newOptions;\n            AppLog.Configure(newLogging);\n            if (Volatile.Read(ref _configurationCommandsStopping) == 0)\n            {\n                RefreshLoggingSettings();\n            }\n        }\n        catch (OperationCanceledException) when (cancellationToken.IsCancellationRequested)\n        {\n        }\n        catch (Exception ex)\n        {\n            MessageBox.Show(this, ex.Message, "Не удалось сохранить настройки", MessageBoxButtons.OK, MessageBoxIcon.Error);\n        }\n    }\n''',
                  '''    private Task SaveLoggingSettingsAsync(\n        LoggingOptions newLogging,\n        CancellationToken cancellationToken)\n    {\n        // Merge the captured logging request with the freshest editable topology, not\n        // merely the last persisted topology. If another object is still invalid this\n        // logging change is staged alongside it; whichever repair makes the complete\n        // draft valid will durably publish and reconcile the whole generation.\n        return ApplyConfigurationAsync(\n            new AppOptions\n            {\n                Proxies = _options.Proxies,\n                VpnConnections = _options.VpnConnections,\n                Logging = newLogging\n            },\n            cancellationToken);\n    }\n'''
              )
          ]

          for old, new in replacements:
              if text.count(old) != 1:
                  raise SystemExit('Expected MainForm fragment was not found exactly once.')
              text = text.replace(old, new, 1)
          main.write_text(text, encoding='utf-8')

          test = Path('tests/ProxyToAnyConnect.SelfTests/EditableConfigurationWorkflowSelfTests.cs')
          if test.exists():
              raise SystemExit('EditableConfigurationWorkflowSelfTests.cs already exists unexpectedly.')
          test.write_text(r'''using ProxyToAnyConnect.Configuration;

namespace ProxyToAnyConnect.SelfTests;

internal static class EditableConfigurationWorkflowSelfTests
{
    public static async Task<int> RunAsync()
    {
        try
        {
            await SequentialRepairsPublishOnlyCompleteGenerationAsync();
            await SaveFailureKeepsDraftButDoesNotAdoptOrApplyAsync();
            await RuntimeFailureKeepsPersistedGenerationAuthoritativeAsync();
            await PreCancellationDoesNotStageAsync();

            Console.WriteLine(
                "PASS: editable configuration workflow stages invalid repairs and publishes only complete durable generations");
            return 0;
        }
        catch (Exception ex)
        {
            Console.Error.WriteLine($"FAIL: editable configuration workflow regression: {ex}");
            return 1;
        }
    }

    private static async Task SequentialRepairsPublishOnlyCompleteGenerationAsync()
    {
        var invalid = CreateOptions(listenPort: 0, retentionDays: 0);
        var firstRepair = CreateOptions(listenPort: 18081, retentionDays: invalid.Logging.RetentionDays);
        AppOptions? draft = null;
        AppOptions? persisted = null;
        AppOptions? applied = null;
        var saves = 0;

        var firstResult = await EditableConfigurationWorkflow.StageValidateSaveApplyAsync(
            firstRepair,
            options => draft = options,
            (_, _) =>
            {
                Interlocked.Increment(ref saves);
                return Task.CompletedTask;
            },
            options => persisted = options,
            (options, _) =>
            {
                applied = options;
                return Task.CompletedTask;
            },
            CancellationToken.None);

        if (firstResult.IsGloballyValid ||
            firstResult.ValidationError is null ||
            !firstResult.ValidationError.Contains("retentionDays", StringComparison.OrdinalIgnoreCase))
        {
            throw new InvalidOperationException(
                "The first independent repair should remain staged until the remaining logging defect is fixed.");
        }

        if (!ReferenceEquals(draft, firstRepair) || saves != 0 || persisted is not null || applied is not null)
        {
            throw new InvalidOperationException(
                "An incomplete staged generation reached persistence or runtime application.");
        }

        var secondRepair = new AppOptions
        {
            Proxies = draft.Proxies,
            VpnConnections = draft.VpnConnections,
            Logging = new LoggingOptions
            {
                Directory = draft.Logging.Directory,
                RetentionDays = 30,
                ConsoleJson = draft.Logging.ConsoleJson
            }
        };

        var secondResult = await EditableConfigurationWorkflow.StageValidateSaveApplyAsync(
            secondRepair,
            options => draft = options,
            (options, _) =>
            {
                if (!ReferenceEquals(options, secondRepair))
                {
                    throw new InvalidOperationException("Save observed a stale editable generation.");
                }

                Interlocked.Increment(ref saves);
                return Task.CompletedTask;
            },
            options => persisted = options,
            (options, _) =>
            {
                applied = options;
                return Task.CompletedTask;
            },
            CancellationToken.None);

        if (!secondResult.IsGloballyValid ||
            saves != 1 ||
            !ReferenceEquals(draft, secondRepair) ||
            !ReferenceEquals(persisted, secondRepair) ||
            !ReferenceEquals(applied, secondRepair) ||
            secondRepair.Proxies[0].ListenPort != 18081)
        {
            throw new InvalidOperationException(
                "The final repair did not atomically publish the complete accumulated draft generation.");
        }
    }

    private static async Task SaveFailureKeepsDraftButDoesNotAdoptOrApplyAsync()
    {
        var desired = CreateOptions(listenPort: 18082, retentionDays: 30);
        AppOptions? draft = null;
        var adopted = 0;
        var applied = 0;

        try
        {
            _ = await EditableConfigurationWorkflow.StageValidateSaveApplyAsync(
                desired,
                options => draft = options,
                (_, _) => throw new SyntheticSaveException(),
                _ => Interlocked.Increment(ref adopted),
                (_, _) =>
                {
                    Interlocked.Increment(ref applied);
                    return Task.CompletedTask;
                },
                CancellationToken.None);

            throw new InvalidOperationException("Synthetic save failure was swallowed.");
        }
        catch (SyntheticSaveException)
        {
        }

        if (!ReferenceEquals(draft, desired) || adopted != 0 || applied != 0)
        {
            throw new InvalidOperationException(
                "Save failure discarded the editable draft or published it as durable/runtime state.");
        }
    }

    private static async Task RuntimeFailureKeepsPersistedGenerationAuthoritativeAsync()
    {
        var desired = CreateOptions(listenPort: 18083, retentionDays: 30);
        AppOptions? draft = null;
        AppOptions? persisted = null;
        var saves = 0;

        try
        {
            _ = await EditableConfigurationWorkflow.StageValidateSaveApplyAsync(
                desired,
                options => draft = options,
                (_, _) =>
                {
                    Interlocked.Increment(ref saves);
                    return Task.CompletedTask;
                },
                options => persisted = options,
                (_, _) => throw new SyntheticRuntimeApplyException(),
                CancellationToken.None);

            throw new InvalidOperationException("Synthetic runtime apply failure was swallowed.");
        }
        catch (SyntheticRuntimeApplyException)
        {
        }

        if (saves != 1 || !ReferenceEquals(draft, desired) || !ReferenceEquals(persisted, desired))
        {
            throw new InvalidOperationException(
                "Runtime failure rolled back or skipped the already-durable editable generation.");
        }
    }

    private static async Task PreCancellationDoesNotStageAsync()
    {
        var desired = CreateOptions(listenPort: 18084, retentionDays: 30);
        using var cancellation = new CancellationTokenSource();
        cancellation.Cancel();
        var staged = 0;

        try
        {
            _ = await EditableConfigurationWorkflow.StageValidateSaveApplyAsync(
                desired,
                _ => Interlocked.Increment(ref staged),
                (_, _) => Task.CompletedTask,
                _ => { },
                (_, _) => Task.CompletedTask,
                cancellation.Token);

            throw new InvalidOperationException("Pre-cancelled editable generation unexpectedly started.");
        }
        catch (OperationCanceledException) when (cancellation.IsCancellationRequested)
        {
        }

        if (staged != 0)
        {
            throw new InvalidOperationException(
                "A queued editable generation published an in-memory draft after shutdown cancellation.");
        }
    }

    private static AppOptions CreateOptions(int listenPort, int retentionDays) => new()
    {
        Proxies =
        [
            new ProxyOptions
            {
                Id = "proxy-editable",
                Name = "Editable proxy",
                ListenAddress = "127.0.0.1",
                ListenPort = listenPort,
                VpnConnectionId = "vpn-editable"
            }
        ],
        VpnConnections =
        [
            new L2tpOptions
            {
                Id = "vpn-editable",
                Name = "Editable VPN",
                Mode = L2tpConnectionMode.ExistingWindowsProfile,
                EntryName = "Editable-L2TP",
                Verification = new VerificationOptions
                {
                    PublicAddress = "1.1.1.1"
                }
            }
        ],
        Logging = new LoggingOptions
        {
            RetentionDays = retentionDays
        }
    };

    private sealed class SyntheticSaveException : Exception
    {
    }

    private sealed class SyntheticRuntimeApplyException : Exception
    {
    }
}
''', encoding='utf-8')

          runner = Path('tests/ProxyToAnyConnect.SelfTests/CombinedTestRunner.cs')
          text = runner.read_text(encoding='utf-8')
          old = '        await RunAsync(nameof(PersistedDesiredConfigurationSelfTests), PersistedDesiredConfigurationSelfTests.RunAsync);\n'
          new = old + '        await RunAsync(nameof(EditableConfigurationWorkflowSelfTests), EditableConfigurationWorkflowSelfTests.RunAsync);\n'
          if text.count(old) != 1:
              raise SystemExit('Combined runner persisted-desired anchor was not found exactly once.')
          text = text.replace(old, new, 1)
          text = text.replace(
              'configuration-persistence/persisted-desired-state/GUI-topology-projection',
              'configuration-persistence/persisted-desired-state/editable-draft-repair/GUI-topology-projection',
              1)
          runner.write_text(text, encoding='utf-8')

      - name: Commit patch to review branch
        shell: bash
        run: |
          set -euo pipefail
          branch='automation/editable-config-repair'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/one-shot-editable-config-repair.yml
          git add src/ProxyToAnyConnect/Gui/MainForm.cs tests/ProxyToAnyConnect.SelfTests/EditableConfigurationWorkflowSelfTests.cs tests/ProxyToAnyConnect.SelfTests/CombinedTestRunner.cs
          git diff --cached --check
          git commit -m 'feat: enable staged configuration repairs'
          git push --force origin "HEAD:refs/heads/$branch"
