name: dev-issue89-cname-rrset

on:
  push:
    branches:
      - dev/issue89-cname-rrset
    paths:
      - .github/workflows/dev-issue89-cname-rrset.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Apply and verify issue 89 transform
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $expectedBase = '4437e8df614271d8e2fd666979dab6a3e85c803c'
          git merge-base --is-ancestor $expectedBase HEAD

          $expected = @{
            'src/ProxyToAnyConnect/Network/L2tpDnsResolver.cs' = '5de77e2aae48fafaa544069c4ce31bb21987b432'
            'tests/ProxyToAnyConnect.SelfTests/DnsResponseBindingSelfTests.cs' = '167a9f5002f0a328cfce36f61297ea033126e5a4'
            'tests/ProxyToAnyConnect.SelfTests/DnsResponseAddressListSelfTests.cs' = '9790851585cdf199f89057494c6c4dc11bea4446'
            'tests/ProxyToAnyConnect.SelfTests/DnsAResultStorageSelfTests.cs' = '35c712a5d3dbed5d1f0c28347c3ec2091e5208a9'
          }
          foreach ($entry in $expected.GetEnumerator()) {
            if ((git rev-parse "$expectedBase`:$($entry.Key)").Trim() -ne $entry.Value) {
              throw "Unexpected #89 base blob: $($entry.Key)"
            }
          }
          if ((git rev-parse 'HEAD:.github/validation/issue89-transform.ps1').Trim() -ne '2b82335b506e7e66d51c162b968ab4ec44124030') {
            throw 'Unexpected #89 transform blob.'
          }
          if ((git rev-parse 'HEAD:.github/validation/issue89-fixture-transform.ps1').Trim() -ne 'df09516e31a0eef2bc7adeeed7540cfcf87a9634') {
            throw 'Unexpected #89 fixture transform blob.'
          }

          $expectedSurface = @(
            '.github/validation/issue89-transform.ps1'
            '.github/validation/issue89-fixture-transform.ps1'
            '.github/workflows/dev-issue89-cname-rrset.yml'
          ) | Sort-Object
          $surface = @(git diff --name-only "$expectedBase...HEAD" | Sort-Object)
          if (($surface -join "`n") -ne ($expectedSurface -join "`n")) {
            throw "Unexpected #89 branch surface: $($surface -join ', ')"
          }

          & ./.github/validation/issue89-transform.ps1
          & ./.github/validation/issue89-fixture-transform.ps1
          git add -- `
            src/ProxyToAnyConnect/Network/L2tpDnsResolver.cs `
            tests/ProxyToAnyConnect.SelfTests/DnsResponseBindingSelfTests.cs `
            tests/ProxyToAnyConnect.SelfTests/DnsResponseAddressListSelfTests.cs `
            tests/ProxyToAnyConnect.SelfTests/DnsAResultStorageSelfTests.cs
          git config core.whitespace cr-at-eol
          git diff --cached --check

          $expectedStaged = @(
            'src/ProxyToAnyConnect/Network/L2tpDnsResolver.cs'
            'tests/ProxyToAnyConnect.SelfTests/DnsResponseBindingSelfTests.cs'
            'tests/ProxyToAnyConnect.SelfTests/DnsResponseAddressListSelfTests.cs'
            'tests/ProxyToAnyConnect.SelfTests/DnsAResultStorageSelfTests.cs'
          ) | Sort-Object
          $staged = @(git diff --cached --name-only | Sort-Object)
          if (($staged -join "`n") -ne ($expectedStaged -join "`n")) {
            throw "Unexpected #89 staged surface: $($staged -join ', ')"
          }
      - name: Build release
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          dotnet build ProxyToAnyConnect.sln -c Release
      - name: Full aggregate self-tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          dotnet .\tests\ProxyToAnyConnect.SelfTests\bin\x64\Release\net10.0-windows\win-x64\ProxyToAnyConnect.SelfTests.dll
      - name: Publish validated issue 89 source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'dns: reject ambiguous CNAME RRsets'
          git push origin HEAD:dev/issue89-cname-rrset
