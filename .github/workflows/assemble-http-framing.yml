name: assemble-http-framing

on:
  push:
    branches:
      - assembly/http-framing

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Decode verified files
        shell: bash
        run: |
          set -euo pipefail
          cat .assembly/server.* | tr -d '\r\n' | base64 -d > src/ProxyToAnyConnect/Proxy/ProxyServer.cs
          cat .assembly/test.* | tr -d '\r\n' | base64 -d > tests/ProxyToAnyConnect.SelfTests/ProxyHttpFramingSelfTests.cs
          cat .assembly/runner.b64 | tr -d '\r\n' | base64 -d > tests/ProxyToAnyConnect.SelfTests/CombinedTestRunner.cs

          server_sha="$(git hash-object src/ProxyToAnyConnect/Proxy/ProxyServer.cs)"
          test_sha="$(git hash-object tests/ProxyToAnyConnect.SelfTests/ProxyHttpFramingSelfTests.cs)"
          runner_sha="$(git hash-object tests/ProxyToAnyConnect.SelfTests/CombinedTestRunner.cs)"
          echo "server=$server_sha"
          echo "test=$test_sha"
          echo "runner=$runner_sha"

          test "$server_sha" = "e72a706217010ea4e11036d86b8e27d0bb4fce4c"
          test "$test_sha" = "2585f0211bd1290fc2699a0ac38419dfee29cb83"
          test "$runner_sha" = "6818e60dfbf617cbb4c9e495111cc44772bd0f8d"

      - name: Commit assembled files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/ProxyToAnyConnect/Proxy/ProxyServer.cs \
                  tests/ProxyToAnyConnect.SelfTests/ProxyHttpFramingSelfTests.cs \
                  tests/ProxyToAnyConnect.SelfTests/CombinedTestRunner.cs
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "assemble verified http framing files"
          git push
