name: dev-issue29

on:
  push:
    branches: [ dev/issue29-paired-ratios ]
    paths:
      - '.github/workflows/dev-issue29.yml'

permissions:
  contents: write

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        attempt: [1, 2, 3]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Apply stable relative-timing contract
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          @'
          from pathlib import Path
          import math
          import re

          WARMUP_FLOOR = 4096
          ROUND_FLOOR = 15
          OPERATIONS_PER_ROUND_FLOOR = 16384
          old_pair = '''        var optimizedMedian = Median(optimizedRounds);
                  var predecessorMedian = Median(predecessorRounds);
                  return new TimingResult(
                      optimizedMedian,
                      predecessorMedian,
                      optimizedMedian / predecessorMedian);'''
          new_pair = '''        var pairedRatios = new double[TimingRounds];
                  for (var round = 0; round < TimingRounds; round++)
                  {
                      pairedRatios[round] = optimizedRounds[round] / predecessorRounds[round];
                  }

                  var optimizedMedian = Median(optimizedRounds);
                  var predecessorMedian = Median(predecessorRounds);
                  return new TimingResult(
                      optimizedMedian,
                      predecessorMedian,
                      Median(pairedRatios));'''
          warmup_pattern = re.compile(r'private const int WarmupIterations = (\d+);')
          rounds_pattern = re.compile(r'private const int TimingRounds = (\d+);')
          iterations_pattern = re.compile(r'private const int IterationsPerRound = (\d+);')
          pair_samples_pattern = re.compile(r'private const int PairSamplesPerRound = (\d+);')
          batch_iterations_pattern = re.compile(r'private const int IterationsPerBatch = (\d+);')

          paired_changed = []
          floor_changes = []
          missing_sampling = []
          for path in sorted(Path('tests').rglob('*.cs')):
              text = path.read_text(encoding='utf-8')
              original = text
              display = str(path).replace(chr(92), '/')

              if old_pair in text:
                  if text.count(old_pair) != 1 or 'double Ratio);' not in text or '.Ratio' not in text:
                      raise SystemExit(f'unexpected paired TimingResult contract in {display}')
                  text = text.replace(old_pair, new_pair)
                  text = text.replace('double Ratio);', 'double PairedRatioMedian);')
                  text = text.replace('.Ratio', '.PairedRatioMedian')
                  paired_changed.append(display)

              if 'MaxMedianSlowdownRatio' in text:
                  warmup = warmup_pattern.search(text)
                  rounds = rounds_pattern.search(text)
                  missing = []
                  if warmup is None:
                      missing.append('warmup')
                  else:
                      current = int(warmup.group(1))
                      if current < WARMUP_FLOOR:
                          text = text[:warmup.start(1)] + str(WARMUP_FLOOR) + text[warmup.end(1):]
                          floor_changes.append(f'{display}: warmup {current} -> {WARMUP_FLOOR}')

                  rounds = rounds_pattern.search(text)
                  if rounds is None:
                      missing.append('rounds')
                  else:
                      current = int(rounds.group(1))
                      if current < ROUND_FLOOR:
                          text = text[:rounds.start(1)] + str(ROUND_FLOOR) + text[rounds.end(1):]
                          floor_changes.append(f'{display}: rounds {current} -> {ROUND_FLOOR}')

                  iterations = iterations_pattern.search(text)
                  if iterations is not None:
                      current = int(iterations.group(1))
                      if current < OPERATIONS_PER_ROUND_FLOOR:
                          text = text[:iterations.start(1)] + str(OPERATIONS_PER_ROUND_FLOOR) + text[iterations.end(1):]
                          floor_changes.append(
                              f'{display}: iterations/round {current} -> {OPERATIONS_PER_ROUND_FLOOR}')
                  else:
                      pair_samples = pair_samples_pattern.search(text)
                      batch_iterations = batch_iterations_pattern.search(text)
                      if pair_samples is None or batch_iterations is None:
                          missing.append('operations-per-round')
                      else:
                          pairs = int(pair_samples.group(1))
                          batch = int(batch_iterations.group(1))
                          if pairs <= 0 or batch <= 0:
                              raise SystemExit(f'invalid batched timing constants in {display}')
                          operations = pairs * batch
                          if operations < OPERATIONS_PER_ROUND_FLOOR:
                              new_batch = math.ceil(OPERATIONS_PER_ROUND_FLOOR / pairs)
                              text = (
                                  text[:batch_iterations.start(1)] + str(new_batch) +
                                  text[batch_iterations.end(1):])
                              floor_changes.append(
                                  f'{display}: batched operations/round {operations} -> {pairs * new_batch}')

                  if missing:
                      missing_sampling.append(f'{display}: {",".join(missing)}')

              if text != original:
                  path.write_text(text, encoding='utf-8', newline='')

          if not paired_changed:
              raise SystemExit('no ratio-of-independent-medians MeasurePaired helpers were found')
          if not floor_changes:
              raise SystemExit('no relative timing gate required sampling-floor migration')
          if missing_sampling:
              raise SystemExit('relative timing gates missing sampling constants: ' + '; '.join(missing_sampling))

          print(f'paired-round migrated files ({len(paired_changed)}):')
          for item in paired_changed:
              print(f'  {item}')
          print(f'sampling-floor changes ({len(floor_changes)}):')
          for item in floor_changes:
              print(f'  {item}')
          '@ | python -
          git diff --check
          git diff --stat
      - name: Run full aggregate self-tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          dotnet run --project tests/ProxyToAnyConnect.SelfTests/ProxyToAnyConnect.SelfTests.csproj --configuration Release

  publish:
    needs: validate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply audited stable relative-timing contract
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          @'
          from pathlib import Path
          import math
          import re

          WARMUP_FLOOR = 4096
          ROUND_FLOOR = 15
          OPERATIONS_PER_ROUND_FLOOR = 16384
          old_pair = '''        var optimizedMedian = Median(optimizedRounds);
                  var predecessorMedian = Median(predecessorRounds);
                  return new TimingResult(
                      optimizedMedian,
                      predecessorMedian,
                      optimizedMedian / predecessorMedian);'''
          new_pair = '''        var pairedRatios = new double[TimingRounds];
                  for (var round = 0; round < TimingRounds; round++)
                  {
                      pairedRatios[round] = optimizedRounds[round] / predecessorRounds[round];
                  }

                  var optimizedMedian = Median(optimizedRounds);
                  var predecessorMedian = Median(predecessorRounds);
                  return new TimingResult(
                      optimizedMedian,
                      predecessorMedian,
                      Median(pairedRatios));'''
          warmup_pattern = re.compile(r'private const int WarmupIterations = (\d+);')
          rounds_pattern = re.compile(r'private const int TimingRounds = (\d+);')
          iterations_pattern = re.compile(r'private const int IterationsPerRound = (\d+);')
          pair_samples_pattern = re.compile(r'private const int PairSamplesPerRound = (\d+);')
          batch_iterations_pattern = re.compile(r'private const int IterationsPerBatch = (\d+);')

          paired_changed = []
          floor_changes = []
          missing_sampling = []
          for path in sorted(Path('tests').rglob('*.cs')):
              text = path.read_text(encoding='utf-8')
              original = text
              display = str(path).replace(chr(92), '/')

              if old_pair in text:
                  if text.count(old_pair) != 1 or 'double Ratio);' not in text or '.Ratio' not in text:
                      raise SystemExit(f'unexpected paired TimingResult contract in {display}')
                  text = text.replace(old_pair, new_pair)
                  text = text.replace('double Ratio);', 'double PairedRatioMedian);')
                  text = text.replace('.Ratio', '.PairedRatioMedian')
                  paired_changed.append(display)

              if 'MaxMedianSlowdownRatio' in text:
                  warmup = warmup_pattern.search(text)
                  rounds = rounds_pattern.search(text)
                  missing = []
                  if warmup is None:
                      missing.append('warmup')
                  else:
                      current = int(warmup.group(1))
                      if current < WARMUP_FLOOR:
                          text = text[:warmup.start(1)] + str(WARMUP_FLOOR) + text[warmup.end(1):]
                          floor_changes.append(f'{display}: warmup {current} -> {WARMUP_FLOOR}')

                  rounds = rounds_pattern.search(text)
                  if rounds is None:
                      missing.append('rounds')
                  else:
                      current = int(rounds.group(1))
                      if current < ROUND_FLOOR:
                          text = text[:rounds.start(1)] + str(ROUND_FLOOR) + text[rounds.end(1):]
                          floor_changes.append(f'{display}: rounds {current} -> {ROUND_FLOOR}')

                  iterations = iterations_pattern.search(text)
                  if iterations is not None:
                      current = int(iterations.group(1))
                      if current < OPERATIONS_PER_ROUND_FLOOR:
                          text = text[:iterations.start(1)] + str(OPERATIONS_PER_ROUND_FLOOR) + text[iterations.end(1):]
                          floor_changes.append(
                              f'{display}: iterations/round {current} -> {OPERATIONS_PER_ROUND_FLOOR}')
                  else:
                      pair_samples = pair_samples_pattern.search(text)
                      batch_iterations = batch_iterations_pattern.search(text)
                      if pair_samples is None or batch_iterations is None:
                          missing.append('operations-per-round')
                      else:
                          pairs = int(pair_samples.group(1))
                          batch = int(batch_iterations.group(1))
                          if pairs <= 0 or batch <= 0:
                              raise SystemExit(f'invalid batched timing constants in {display}')
                          operations = pairs * batch
                          if operations < OPERATIONS_PER_ROUND_FLOOR:
                              new_batch = math.ceil(OPERATIONS_PER_ROUND_FLOOR / pairs)
                              text = (
                                  text[:batch_iterations.start(1)] + str(new_batch) +
                                  text[batch_iterations.end(1):])
                              floor_changes.append(
                                  f'{display}: batched operations/round {operations} -> {pairs * new_batch}')

                  if missing:
                      missing_sampling.append(f'{display}: {",".join(missing)}')

              if text != original:
                  path.write_text(text, encoding='utf-8', newline='')

          if not paired_changed or not floor_changes:
              raise SystemExit('relative timing audit did not produce both required migration classes')
          if missing_sampling:
              raise SystemExit('relative timing gates missing sampling constants: ' + '; '.join(missing_sampling))
          print(f'paired={len(paired_changed)} sampling={len(floor_changes)}')
          '@ | python -
          git diff --check
          $changed = @(git diff --name-only)
          if ($changed.Count -lt 2) {
            throw "Expected broad performance-gate audit, changed only: $($changed -join ', ')"
          }
          git config user.name 'ProxyToAnyConnect CI'
          git config user.email 'actions@github.com'
          git add tests
          git commit -m 'test: stabilize relative performance gates'
          git push origin HEAD:refs/heads/dev/issue29-paired-ratios
