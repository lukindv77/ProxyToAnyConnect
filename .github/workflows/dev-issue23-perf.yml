name: dev-issue23-perf

on:
  push:
    branches: [ dev/issue23-connect-perf ]
    paths:
      - '.github/workflows/dev-issue23-perf.yml'

permissions:
  contents: write

jobs:
  optimize-and-test:
    runs-on: windows-latest
    steps:
      - name: Checkout exact dev head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Apply single-pass CONNECT validation and run aggregate tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $source = 'src/ProxyToAnyConnect/Proxy/ProxyServer.cs'
          if ((git hash-object $source).Trim() -ne '7d45db5eaddca7565b33877e2350b04328bd4f54') {
            throw 'ProxyServer.cs no longer matches the issue #23 failed-build blob.'
          }

          @'
          from pathlib import Path

          source = Path('src/ProxyToAnyConnect/Proxy/ProxyServer.cs')
          text = source.read_text(encoding='utf-8')

          old_name = '''        private static bool IsValidHeaderName(ReadOnlySpan<char> name)
                  {
                      if (name.IsEmpty)
                      {
                          return false;
                      }

                      foreach (var character in name)
                      {
                          if (character > 0x7F ||
                              !(char.IsAsciiLetterOrDigit(character) ||
                                character is '!' or '#' or '$' or '%' or '&' or '\\'' or '*' or '+' or '-' or '.' or '^' or '_' or '`' or '|' or '~'))
                          {
                              return false;
                          }
                      }

                      return true;
                  }'''
          new_name = '''        private static bool IsValidHeaderNameCharacter(char character) =>
                      character <= 0x7F &&
                      (char.IsAsciiLetterOrDigit(character) ||
                       character is '!' or '#' or '$' or '%' or '&' or '\\'' or '*' or '+' or '-' or '.' or '^' or '_' or '`' or '|' or '~');

                  private static bool IsValidHeaderName(ReadOnlySpan<char> name)
                  {
                      if (name.IsEmpty)
                      {
                          return false;
                      }

                      foreach (var character in name)
                      {
                          if (!IsValidHeaderNameCharacter(character))
                          {
                              return false;
                          }
                      }

                      return true;
                  }'''
          if text.count(old_name) != 1:
              raise SystemExit(f'expected one header-name validator, got {text.count(old_name)}')
          text = text.replace(old_name, new_name)

          start = text.index('        private static void ValidateHeaderLines(string text, int offset)\n')
          end = text.index('        public byte[] BuildOriginHeader(string pathAndQuery)\n', start)
          replacement = '''        private static void ValidateHeaderLines(string text, int offset)
                  {
                      while (offset < text.Length)
                      {
                          var remaining = text.AsSpan(offset);
                          var lineEnd = remaining.IndexOf("\\r\\n".AsSpan());
                          if (lineEnd < 0)
                          {
                              throw new InvalidDataException("Invalid HTTP header line.");
                          }

                          if (lineEnd == 0)
                          {
                              return;
                          }

                          var line = remaining[..lineEnd];
                          var separator = -1;
                          for (var i = 0; i < line.Length; i++)
                          {
                              var character = line[i];
                              if (separator < 0)
                              {
                                  if (character == ':')
                                  {
                                      if (i == 0)
                                      {
                                          throw new InvalidDataException("Invalid HTTP header line.");
                                      }

                                      separator = i;
                                      continue;
                                  }

                                  if (!IsValidHeaderNameCharacter(character))
                                  {
                                      throw new InvalidDataException("Invalid HTTP header name.");
                                  }
                              }
                              else if ((character < 0x20 && character != '\\t') || character == 0x7F)
                              {
                                  throw new InvalidDataException("Invalid HTTP header field value.");
                              }
                          }

                          if (separator < 0)
                          {
                              throw new InvalidDataException("Invalid HTTP header line.");
                          }

                          offset += lineEnd + 2;
                      }
                  }

          '''
          text = text[:start] + replacement + text[end:]
          source.write_text(text, encoding='utf-8', newline='')
          '@ | python -

          git diff --check
          $changed = @(git diff --name-only)
          if ($changed.Count -ne 1 -or $changed[0] -ne $source) {
            throw "Unexpected issue #23 perf patch result: $($changed -join ', ')"
          }

          dotnet run --project tests/ProxyToAnyConnect.SelfTests/ProxyToAnyConnect.SelfTests.csproj --configuration Release

          git config user.name 'ProxyToAnyConnect CI'
          git config user.email 'actions@github.com'
          git add $source
          git commit -m 'proxy: make CONNECT header validation single-pass'
          git push origin HEAD:refs/heads/dev/issue23-connect-perf
