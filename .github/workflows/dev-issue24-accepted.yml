name: dev-issue24-accepted

on:
  push:
    branches: [ dev/issue24-accepted ]
    paths:
      - '.github/workflows/dev-issue24-accepted.yml'

permissions:
  contents: write

jobs:
  aggregate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Align request-line semantic comparators
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $expected = @{
            'tests/ProxyToAnyConnect.SelfTests/ProxyParserAllocationSelfTests.cs' = '7d881fb38d3f699b28827140c740ac7375ff3693'
            'tests/ProxyToAnyConnect.SelfTests/ProxyConnectSetupSelfTests.cs' = '3737e6c7df7739141d5989eb35195d5e4dd72c95'
          }
          foreach ($entry in $expected.GetEnumerator()) {
            if ((git rev-parse "HEAD:$($entry.Key)").Trim() -ne $entry.Value) {
              throw "Unexpected #24 comparator blob: $($entry.Key)"
            }
          }

          @'
          from pathlib import Path

          alloc = Path('tests/ProxyToAnyConnect.SelfTests/ProxyParserAllocationSelfTests.cs')
          text = alloc.read_text(encoding='utf-8')
          old = '            "GET http://example.test/a HTTP/1.1 extra-data"'
          new = '            "GET http://example.test/a HTTP/1.0"'
          if text.count(old) != 1:
              raise SystemExit(f'expected one obsolete request-line fixture, got {text.count(old)}')
          alloc.write_text(text.replace(old, new), encoding='utf-8', newline='')

          connect = Path('tests/ProxyToAnyConnect.SelfTests/ProxyConnectSetupSelfTests.cs')
          text = connect.read_text(encoding='utf-8')
          old = '''        var method = requestLine[requestParts[0]].ToString();
                  var target = requestLine[requestParts[1]].ToString();
                  var version = requestLine[requestParts[2]].ToString();'''
          new = '''        var methodSpan = requestLine[requestParts[0]];
                  var versionSpan = requestLine[requestParts[2]];
                  if (!IsValidBaselineHeaderName(methodSpan))
                  {
                      throw new InvalidDataException("Invalid HTTP method token.");
                  }

                  if (!versionSpan.SequenceEqual("HTTP/1.0".AsSpan()) &&
                      !versionSpan.SequenceEqual("HTTP/1.1".AsSpan()))
                  {
                      throw new InvalidDataException("Unsupported HTTP request version.");
                  }

                  var method = methodSpan.ToString();
                  var target = requestLine[requestParts[1]].ToString();
                  var version = versionSpan.ToString();'''
          if text.count(old) != 1:
              raise SystemExit(f'expected one CONNECT comparator request-line block, got {text.count(old)}')
          connect.write_text(text.replace(old, new), encoding='utf-8', newline='')
          '@ | python -

          git diff --check
          $changed = @(git diff --name-only)
          if ($changed.Count -ne 2) {
            throw "Unexpected #24 semantic-comparator patch: $($changed -join ', ')"
          }
      - name: Restore and build
        shell: pwsh
        run: |
          dotnet restore ProxyToAnyConnect.sln
          dotnet build ProxyToAnyConnect.sln --configuration Release --no-restore
      - name: Run full self-test executable
        shell: pwsh
        run: ./tests/ProxyToAnyConnect.SelfTests/bin/x64/Release/net10.0-windows/win-x64/ProxyToAnyConnect.SelfTests.exe
      - name: Publish semantic-comparator fixes
        shell: pwsh
        run: |
          git config user.name 'ProxyToAnyConnect CI'
          git config user.email 'actions@github.com'
          git add tests/ProxyToAnyConnect.SelfTests/ProxyParserAllocationSelfTests.cs tests/ProxyToAnyConnect.SelfTests/ProxyConnectSetupSelfTests.cs
          git commit -m 'test: align proxy comparators with strict request line'
          git push origin HEAD:refs/heads/dev/issue24-accepted
