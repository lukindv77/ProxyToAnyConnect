name: dev-issue24-accepted

on:
  push:
    branches: [ dev/issue24-accepted ]
    paths:
      - '.github/workflows/dev-issue24-accepted.yml'

permissions:
  contents: write

jobs:
  aggregate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Align accepted request-line allocation fixture
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $test = 'tests/ProxyToAnyConnect.SelfTests/ProxyParserAllocationSelfTests.cs'
          if ((git rev-parse "HEAD:$test").Trim() -ne '7d881fb38d3f699b28827140c740ac7375ff3693') {
            throw 'Unexpected parser allocation test blob.'
          }
          @'
          from pathlib import Path
          path = Path('tests/ProxyToAnyConnect.SelfTests/ProxyParserAllocationSelfTests.cs')
          text = path.read_text(encoding='utf-8')
          old = '            "GET http://example.test/a HTTP/1.1 extra-data"'
          new = '            "GET http://example.test/a HTTP/1.0"'
          if text.count(old) != 1:
              raise SystemExit(f'expected one obsolete request-line fixture, got {text.count(old)}')
          path.write_text(text.replace(old, new), encoding='utf-8', newline='')
          '@ | python -
          git diff --check
          $changed = @(git diff --name-only)
          if ($changed.Count -ne 1 -or $changed[0] -ne $test) {
            throw "Unexpected #24 semantic-fixture patch: $($changed -join ', ')"
          }
      - name: Restore and build
        shell: pwsh
        run: |
          dotnet restore ProxyToAnyConnect.sln
          dotnet build ProxyToAnyConnect.sln --configuration Release --no-restore
      - name: Run full self-test executable
        shell: pwsh
        run: ./tests/ProxyToAnyConnect.SelfTests/bin/x64/Release/net10.0-windows/win-x64/ProxyToAnyConnect.SelfTests.exe
      - name: Publish semantic-fixture fix
        shell: pwsh
        run: |
          git config user.name 'ProxyToAnyConnect CI'
          git config user.email 'actions@github.com'
          git add tests/ProxyToAnyConnect.SelfTests/ProxyParserAllocationSelfTests.cs
          git commit -m 'test: align parser allocation fixture with strict request line'
          git push origin HEAD:refs/heads/dev/issue24-accepted
