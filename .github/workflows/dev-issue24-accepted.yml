name: dev-issue24-accepted

on:
  push:
    branches: [ dev/issue24-accepted ]
    paths:
      - '.github/workflows/dev-issue24-accepted.yml'

jobs:
  aggregate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore and build
        shell: pwsh
        run: |
          dotnet restore ProxyToAnyConnect.sln
          dotnet build ProxyToAnyConnect.sln --configuration Release --no-restore
      - name: Run full self-test executable
        shell: pwsh
        run: ./tests/ProxyToAnyConnect.SelfTests/bin/x64/Release/net10.0-windows/win-x64/ProxyToAnyConnect.SelfTests.exe
