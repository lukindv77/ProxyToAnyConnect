name: dev-apply-issue22

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/dev-apply-issue22.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact staging head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply exact-context source patch
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/issue22.patch.b64 <<'EOF'

EOF
          base64 -d /tmp/issue22.patch.b64 > /tmp/issue22.patch
          git apply --check --ignore-space-change /tmp/issue22.patch
          git apply --ignore-space-change /tmp/issue22.patch

          mapfile -t changed < <(git diff --name-only)
          if [[ ${#changed[@]} -ne 2 || " ${changed[*]} " != *" src/ProxyToAnyConnect/Proxy/ProxyServer.cs "* || " ${changed[*]} " != *" tests/ProxyToAnyConnect.SelfTests/CombinedTestRunner.cs "* ]]; then
            printf 'Unexpected patch result: %s\n' "${changed[*]}" >&2
            exit 1
          fi

          git config user.name 'ProxyToAnyConnect CI'
          git config user.email 'actions@github.com'
          git add src/ProxyToAnyConnect/Proxy/ProxyServer.cs tests/ProxyToAnyConnect.SelfTests/CombinedTestRunner.cs
          git commit -m 'proxy: regenerate Host from absolute HTTP target'
          git push origin HEAD:main
