name: dev-issue44-http-ows

on:
  push:
    branches:
      - dev/issue44-http-ows
    paths:
      - .github/workflows/dev-issue44-http-ows.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Apply and verify issue 44 patch
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $expectedBase = '1fd102796ead64c294e1811c42328dc9f9b6207c'
          $base = (git merge-base HEAD origin/main).Trim()
          if ($base -ne $expectedBase) { throw "Unexpected #44 merge base: $base" }

          git -c core.whitespace=cr-at-eol diff $expectedBase HEAD --check
          git apply --check .github/validation/issue44.patch
          git apply .github/validation/issue44.patch
          git -c core.whitespace=cr-at-eol diff --check

          git add -- src/ProxyToAnyConnect/Proxy/ProxyServer.cs tests/ProxyToAnyConnect.SelfTests/ProxyHttpFramingSelfTests.cs
          $sourceBlob = (git rev-parse ':src/ProxyToAnyConnect/Proxy/ProxyServer.cs').Trim()
          $testBlob = (git rev-parse ':tests/ProxyToAnyConnect.SelfTests/ProxyHttpFramingSelfTests.cs').Trim()
          if ($sourceBlob -ne '7033087e57a28d93bdfde3a495a795b8f4b314b1') {
            throw "Unexpected patched ProxyServer blob: $sourceBlob"
          }
          if ($testBlob -ne 'fd1b736090c9a873a5f591deabbe3bac12b7b446') {
            throw "Unexpected patched framing-test blob: $testBlob"
          }
          $staged = @(git diff --cached --name-only)
          if ($staged.Count -ne 2) { throw "Unexpected #44 staged surface: $($staged -join ', ')" }
      - name: Full aggregate self-tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          dotnet run --project tests/ProxyToAnyConnect.SelfTests/ProxyToAnyConnect.SelfTests.csproj --configuration Release
      - name: Publish validated issue 44 source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'proxy: use HTTP OWS-only field-value trimming'
          git push origin HEAD:dev/issue44-http-ows
