name: handoff

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  archive:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assemble handoff source tree
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $stage = Join-Path $env:RUNNER_TEMP 'ProxyToAnyConnect-handoff'
          if (Test-Path $stage) {
            Remove-Item $stage -Recurse -Force
          }
          New-Item -ItemType Directory -Path $stage | Out-Null

          $items = @(
            'src',
            'tests',
            'tools',
            'docs',
            '.github',
            'README.md',
            'ProxyToAnyConnect.sln',
            '.gitignore',
            'START_NEW_CHAT_PROMPT.md'
          )

          foreach ($item in $items) {
            if (Test-Path $item) {
              Copy-Item $item -Destination $stage -Recurse -Force
            }
          }

          @(
            "Repository=lukindv77/ProxyToAnyConnect",
            "Commit=$env:GITHUB_SHA",
            "Ref=$env:GITHUB_REF",
            "WorkflowRun=$env:GITHUB_RUN_NUMBER",
            "CreatedUtc=$([DateTime]::UtcNow.ToString('O'))",
            'StartNewChatWith=docs/handoff/NEW_CHAT_PROMPT.md',
            'ReadFirst=docs/handoff/SESSION_2026-08-28.md;docs/handoff/CURRENT_STATE.md;docs/handoff/AUDIT_SNAPSHOT.md;docs/handoff/ACTIVE_DEVELOPMENT.md;docs/handoff/FINAL_CI_STATUS.md;docs/handoff/ISSUES_SNAPSHOT.md;docs/requirements.md;docs/architecture.md;docs/memory-stability.md;docs/windows-integration-evidence.md;docs/windows-soak-evidence.md'
          ) | Set-Content -Path (Join-Path $stage 'HANDOFF_BUILD_INFO.txt') -Encoding utf8

          git log --date=iso-strict --pretty=format:'%H%x09%ad%x09%s' -n 120 |
            Set-Content -Path (Join-Path $stage 'RECENT_COMMITS.tsv') -Encoding utf8

          @(
            'Live GitHub main is authoritative over this archive.',
            'Start with docs/handoff/NEW_CHAT_PROMPT.md.',
            'Then read SESSION_2026-08-28.md, CURRENT_STATE.md, AUDIT_SNAPSHOT.md, ACTIVE_DEVELOPMENT.md, FINAL_CI_STATUS.md and ISSUES_SNAPSHOT.md.',
            'Fetch live issues/comments, dev/issue49-probe-target and exact-head build + handoff Actions before claiming acceptance.'
          ) | Set-Content -Path (Join-Path $stage 'START_HERE.txt') -Encoding utf8

          Get-ChildItem $stage -Recurse -Directory |
            Where-Object { $_.Name -in @('bin', 'obj', '.git') } |
            Sort-Object FullName -Descending |
            Remove-Item -Recurse -Force -ErrorAction SilentlyContinue

          $archive = Join-Path $env:RUNNER_TEMP "ProxyToAnyConnect-handoff-$env:GITHUB_SHA.zip"
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath $archive -CompressionLevel Optimal
          "HANDOFF_ARCHIVE=$archive" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Upload handoff archive
        uses: actions/upload-artifact@v4
        with:
          name: ProxyToAnyConnect-handoff-${{ github.sha }}
          path: ${{ env.HANDOFF_ARCHIVE }}
          if-no-files-found: error
          retention-days: 90
