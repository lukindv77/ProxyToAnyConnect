name: dev-issue23-benchmark

on:
  push:
    branches: [ dev/issue23-benchmark-contract ]
    paths:
      - '.github/workflows/dev-issue23-benchmark.yml'

permissions:
  contents: write

jobs:
  validate-benchmark-contract:
    runs-on: windows-latest
    steps:
      - name: Checkout exact dev head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Make CONNECT benchmark semantic-equivalent and run aggregate tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $test = 'tests/ProxyToAnyConnect.SelfTests/ProxyConnectSetupSelfTests.cs'
          if ((git hash-object $test).Trim() -ne 'c28ee3695072bdb068dd97235a8be4502821bf7c') {
            throw 'ProxyConnectSetupSelfTests.cs no longer matches the audited benchmark blob.'
          }

          @'
          from pathlib import Path

          path = Path('tests/ProxyToAnyConnect.SelfTests/ProxyConnectSetupSelfTests.cs')
          text = path.read_text(encoding='utf-8')

          text = text.replace(
              '// Test-only copy of the production text-span parser immediately before the\n    // CONNECT-specific syntax-only path. It materializes every header name/value.',
              '// Test-only semantic-equivalent full-materialization comparator. It performs\n    // the same header-name and field-value validation as production before\n    // materializing every header name/value, so the timing gate compares equal work.')

          old = '''            var separator = line.IndexOf(':');
                      if (separator <= 0)
                      {
                          throw new InvalidDataException("Invalid HTTP header line.");
                      }

                      headers.Add(new BaselineHeaderLine(
                          line[..separator].Trim().ToString(),
                          line[(separator + 1)..].Trim().ToString()));'''
          new = '''            var separator = line.IndexOf(':');
                      if (separator <= 0 || char.IsWhiteSpace(line[separator - 1]))
                      {
                          throw new InvalidDataException("Invalid HTTP header line.");
                      }

                      var name = line[..separator];
                      if (!IsValidBaselineHeaderName(name))
                      {
                          throw new InvalidDataException("Invalid HTTP header name.");
                      }

                      var rawValue = line[(separator + 1)..];
                      if (!IsValidBaselineHeaderValue(rawValue))
                      {
                          throw new InvalidDataException("Invalid HTTP header field value.");
                      }

                      headers.Add(new BaselineHeaderLine(
                          name.ToString(),
                          rawValue.Trim().ToString()));'''
          if text.count(old) != 1:
              raise SystemExit(f'expected one baseline header parser site, got {text.count(old)}')
          text = text.replace(old, new)

          marker = '''        return new BaselineRequest(method, target, version, headers);
              }

              private readonly record struct TimingResult('''
          helpers = '''        return new BaselineRequest(method, target, version, headers);
              }

              private static bool IsValidBaselineHeaderName(ReadOnlySpan<char> name)
              {
                  if (name.IsEmpty)
                  {
                      return false;
                  }

                  foreach (var character in name)
                  {
                      if (!((uint)(character - '0') <= 9 ||
                            (uint)((character | 0x20) - 'a') <= 25 ||
                            character is '!' or '#' or '$' or '%' or '&' or '\\'' or '*' or '+' or '-' or '.' or '^' or '_' or '`' or '|' or '~'))
                      {
                          return false;
                      }
                  }

                  return true;
              }

              private static bool IsValidBaselineHeaderValue(ReadOnlySpan<char> value)
              {
                  foreach (var character in value)
                  {
                      if ((character < 0x20 && character != '\\t') || character == 0x7F)
                      {
                          return false;
                      }
                  }

                  return true;
              }

              private readonly record struct TimingResult('''
          if text.count(marker) != 1:
              raise SystemExit(f'expected one baseline helper insertion site, got {text.count(marker)}')
          text = text.replace(marker, helpers)

          validation_anchor = '''        AssertBothRejectMalformed(
                  "CONNECT example.test:443 HTTP/1.1\\r\\n" +
                  ": missing-name\\r\\n\\r\\n");'''
          validation_more = validation_anchor + '''
              AssertBothRejectMalformed(
                  "CONNECT example.test:443 HTTP/1.1\\r\\n" +
                  "Bad Name: rejected\\r\\n\\r\\n");
              AssertBothRejectMalformed(
                  "CONNECT example.test:443 HTTP/1.1\\r\\n" +
                  "X-Test: bad\\0value\\r\\n\\r\\n");'''
          if text.count(validation_anchor) != 1:
              raise SystemExit(f'expected one malformed validation anchor, got {text.count(validation_anchor)}')
          text = text.replace(validation_anchor, validation_more)

          path.write_text(text, encoding='utf-8', newline='')
          '@ | python -

          git diff --check
          $changed = @(git diff --name-only)
          if ($changed.Count -ne 1 -or $changed[0] -ne $test) {
            throw "Unexpected benchmark contract patch: $($changed -join ', ')"
          }

          dotnet run --project tests/ProxyToAnyConnect.SelfTests/ProxyToAnyConnect.SelfTests.csproj --configuration Release

          git config user.name 'ProxyToAnyConnect CI'
          git config user.email 'actions@github.com'
          git add $test
          git commit -m 'test: compare CONNECT parser against security-equivalent baseline'
          git push origin HEAD:refs/heads/dev/issue23-benchmark-contract
