name: dev-issue80-client-header-timeout

on:
  push:
    branches:
      - dev/issue80-client-header-timeout
    paths:
      - .github/workflows/dev-issue80-client-header-timeout.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Apply and verify issue 80 transform
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $expectedBase = 'befadd69d02111902c4e9bc33e6f1baaddf12fec'
          git merge-base --is-ancestor $expectedBase HEAD

          $expectedProxyBlob = 'ebae55546d38eb939d542562c2e5267c8d99b3da'
          $expectedRunnerBlob = '3fd222b1c674f2028b8f645c0441d5532f4708b7'
          $expectedTransformBlob = 'bd62523aed8ed9c6fae9935880897bf86bb26842'
          $expectedTestBlob = '7af8ea09d905e0f49717e06dc5103b661fa0a3a1'

          if ((git rev-parse "$expectedBase`:src/ProxyToAnyConnect/Proxy/ProxyServer.cs").Trim() -ne $expectedProxyBlob) { throw 'Unexpected #80 base ProxyServer blob.' }
          if ((git rev-parse "$expectedBase`:tests/ProxyToAnyConnect.SelfTests/CombinedTestRunner.cs").Trim() -ne $expectedRunnerBlob) { throw 'Unexpected #80 base CombinedTestRunner blob.' }
          if ((git rev-parse 'HEAD:.github/validation/issue80-transform.ps1').Trim() -ne $expectedTransformBlob) { throw 'Unexpected #80 transform blob.' }
          if ((git rev-parse 'HEAD:tests/ProxyToAnyConnect.SelfTests/ProxyClientHeaderTimeoutSelfTests.cs').Trim() -ne $expectedTestBlob) { throw 'Unexpected #80 regression-test blob.' }

          $expectedBranchSurface = @(
            '.github/validation/issue80-transform.ps1'
            '.github/workflows/dev-issue80-client-header-timeout.yml'
            'tests/ProxyToAnyConnect.SelfTests/ProxyClientHeaderTimeoutSelfTests.cs'
          ) | Sort-Object
          $branchSurface = @(git diff --name-only "$expectedBase...HEAD" | Sort-Object)
          if (($branchSurface -join "`n") -ne ($expectedBranchSurface -join "`n")) { throw "Unexpected #80 pre-transform branch surface: $($branchSurface -join ', ')" }

          & ./.github/validation/issue80-transform.ps1

          git add -- src/ProxyToAnyConnect/Proxy/ProxyServer.cs tests/ProxyToAnyConnect.SelfTests/CombinedTestRunner.cs
          git config core.whitespace cr-at-eol
          git diff --cached --check
          $expectedStaged = @('src/ProxyToAnyConnect/Proxy/ProxyServer.cs','tests/ProxyToAnyConnect.SelfTests/CombinedTestRunner.cs') | Sort-Object
          $staged = @(git diff --cached --name-only | Sort-Object)
          if (($staged -join "`n") -ne ($expectedStaged -join "`n")) { throw "Unexpected #80 staged surface: $($staged -join ', ')" }
      - name: Full aggregate self-tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          dotnet run --project tests/ProxyToAnyConnect.SelfTests/ProxyToAnyConnect.SelfTests.csproj --configuration Release
      - name: Publish validated issue 80 source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'proxy: classify client header deadline as request timeout'
          git push origin HEAD:dev/issue80-client-header-timeout
