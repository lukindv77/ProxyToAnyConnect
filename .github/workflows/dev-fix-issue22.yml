name: dev-fix-issue22

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/dev-fix-issue22.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply exact compile fix on staging branch
        shell: bash
        run: |
          set -euo pipefail
          path='src/ProxyToAnyConnect/Proxy/ProxyServer.cs'
          if [[ "$(git hash-object "$path")" != '77519987f1ac72572618e9f71426c4c16597aa48' ]]; then
            echo 'ProxyServer.cs no longer matches failed-build blob.' >&2
            exit 1
          fi
          python - <<'PY'
          from pathlib import Path
          path = Path('src/ProxyToAnyConnect/Proxy/ProxyServer.cs')
          text = path.read_text(encoding='utf-8')
          old = 'written += Encoding.Latin1.GetBytes(header.Name.AsSpan((), destination[written..]);'
          new = 'written += Encoding.Latin1.GetBytes(header.Name.AsSpan(), destination[written..]);'
          if text.count(old) != 1:
              raise SystemExit(f'expected one malformed expression, got {text.count(old)}')
          path.write_text(text.replace(old, new), encoding='utf-8', newline='')
          PY
          git diff --check
          git diff --exit-code -- . ':!src/ProxyToAnyConnect/Proxy/ProxyServer.cs' || exit 1
          git config user.name 'ProxyToAnyConnect CI'
          git config user.email 'actions@github.com'
          git add "$path"
          git commit -m 'fix: repair Host header builder compile expression'
          git push origin HEAD:refs/heads/dev/issue22-fix
