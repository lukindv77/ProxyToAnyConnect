name: build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore ProxyToAnyConnect.sln

      - name: Build
        run: dotnet build ProxyToAnyConnect.sln --configuration Release --no-restore

      - name: Self-tests
        shell: pwsh
        run: ./tests/ProxyToAnyConnect.SelfTests/bin/x64/Release/net10.0-windows/win-x64/ProxyToAnyConnect.SelfTests.exe

      - name: Publish self-contained win-x64
        if: github.event_name == 'push'
        run: >-
          dotnet publish src/ProxyToAnyConnect/ProxyToAnyConnect.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          --output artifacts/ProxyToAnyConnect-win-x64

      - name: Create ZIP
        if: github.event_name == 'push'
        shell: pwsh
        run: Compress-Archive -Path ./artifacts/ProxyToAnyConnect-win-x64/* -DestinationPath ./artifacts/ProxyToAnyConnect-win-x64.zip -Force

      - name: Upload Windows artifact
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: ProxyToAnyConnect-win-x64
          path: artifacts/ProxyToAnyConnect-win-x64.zip
          if-no-files-found: error
