name: build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate PowerShell tools
        shell: pwsh
        run: |
          $toolPaths = @(
            './tools/Invoke-WindowsIntegrationEvidence.ps1',
            './tools/Test-WindowsIntegrationEvidence.ps1',
            './tools/Complete-WindowsIntegrationEvidence.ps1'
          )
          foreach ($toolPath in $toolPaths) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $toolPath),
              [ref]$tokens,
              [ref]$errors) | Out-Null
            if ($errors.Count -ne 0) {
              $errors | ForEach-Object { Write-Error "${toolPath}: $($_.Message)" }
              exit 1
            }
          }

      - name: Smoke-test Windows integration evidence lifecycle
        shell: pwsh
        run: |
          $output = './artifacts/integration-evidence-smoke'
          foreach ($stage in @('Baseline', 'Ready', 'Final')) {
            ./tools/Invoke-WindowsIntegrationEvidence.ps1 `
              -Stage $stage `
              -OutputDirectory $output `
              -SkipExternalProbes | Write-Host
          }

          ./tools/Complete-WindowsIntegrationEvidence.ps1 `
            -OutputDirectory $output | Write-Host

          foreach ($stage in @('baseline', 'ready', 'final')) {
            foreach ($fileName in @('evidence.json', 'summary.json', 'manifest.json')) {
              $requiredPath = Join-Path (Join-Path $output $stage) $fileName
              if (-not (Test-Path -LiteralPath $requiredPath -PathType Leaf)) {
                throw "Evidence lifecycle did not create $requiredPath"
              }
            }
          }

          $acceptancePath = Join-Path $output 'acceptance-summary.json'
          if (-not (Test-Path -LiteralPath $acceptancePath -PathType Leaf)) {
            throw "Evidence lifecycle did not create $acceptancePath"
          }

          $acceptance = Get-Content -LiteralPath $acceptancePath -Raw | ConvertFrom-Json
          if ($acceptance.schemaVersion -ne 1 -or -not $acceptance.passed) {
            throw 'Evidence lifecycle emitted an unsuccessful acceptance summary.'
          }
          if ($acceptance.externalProbesRequired -or $acceptance.proxyHttpProbeRequired) {
            throw 'Hosted smoke unexpectedly required external integration probes.'
          }
          if ($acceptance.routeFingerprint -ne $acceptance.stages.Baseline.routeFingerprint -or
              $acceptance.routeFingerprint -ne $acceptance.stages.Ready.routeFingerprint -or
              $acceptance.routeFingerprint -ne $acceptance.stages.Final.routeFingerprint) {
            throw 'Acceptance summary did not preserve one route fingerprint across all stages.'
          }

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore ProxyToAnyConnect.sln

      - name: Build
        run: dotnet build ProxyToAnyConnect.sln --configuration Release --no-restore

      - name: Self-tests
        shell: pwsh
        run: ./tests/ProxyToAnyConnect.SelfTests/bin/x64/Release/net10.0-windows/win-x64/ProxyToAnyConnect.SelfTests.exe

      - name: Publish self-contained win-x64
        if: github.event_name == 'push'
        run: >-
          dotnet publish src/ProxyToAnyConnect/ProxyToAnyConnect.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          --output artifacts/ProxyToAnyConnect-win-x64

      - name: Create ZIP
        if: github.event_name == 'push'
        shell: pwsh
        run: Compress-Archive -Path ./artifacts/ProxyToAnyConnect-win-x64/* -DestinationPath ./artifacts/ProxyToAnyConnect-win-x64.zip -Force

      - name: Upload Windows artifact
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: ProxyToAnyConnect-win-x64
          path: artifacts/ProxyToAnyConnect-win-x64.zip
          if-no-files-found: error
