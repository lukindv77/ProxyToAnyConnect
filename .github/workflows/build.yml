name: build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate PowerShell tools
        shell: pwsh
        run: |
          $toolPaths = @(
            './tools/Invoke-WindowsIntegrationEvidence.ps1',
            './tools/Test-WindowsIntegrationEvidence.ps1',
            './tools/Complete-WindowsIntegrationEvidence.ps1',
            './tools/Invoke-WindowsSoakEvidence.ps1',
            './tools/Test-WindowsSoakEvidence.ps1',
            './tools/Test-WindowsSoakLogCorrelation.ps1'
          )
          foreach ($toolPath in $toolPaths) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $toolPath),
              [ref]$tokens,
              [ref]$errors) | Out-Null
            if ($errors.Count -ne 0) {
              $errors | ForEach-Object { Write-Error "${toolPath}: $($_.Message)" }
              exit 1
            }
          }

      - name: Smoke-test Windows integration evidence lifecycle
        shell: pwsh
        run: |
          $output = './artifacts/integration-evidence-smoke'
          foreach ($stage in @('Baseline', 'Ready', 'Final')) {
            ./tools/Invoke-WindowsIntegrationEvidence.ps1 `
              -Stage $stage `
              -OutputDirectory $output `
              -SkipExternalProbes | Write-Host
          }

          ./tools/Complete-WindowsIntegrationEvidence.ps1 `
            -OutputDirectory $output | Write-Host

          foreach ($stage in @('baseline', 'ready', 'final')) {
            foreach ($fileName in @('evidence.json', 'summary.json', 'manifest.json')) {
              $requiredPath = Join-Path (Join-Path $output $stage) $fileName
              if (-not (Test-Path -LiteralPath $requiredPath -PathType Leaf)) {
                throw "Evidence lifecycle did not create $requiredPath"
              }
            }
          }

          $acceptancePath = Join-Path $output 'acceptance-summary.json'
          if (-not (Test-Path -LiteralPath $acceptancePath -PathType Leaf)) {
            throw "Evidence lifecycle did not create $acceptancePath"
          }

          $acceptance = Get-Content -LiteralPath $acceptancePath -Raw | ConvertFrom-Json
          if ($acceptance.schemaVersion -ne 1 -or -not $acceptance.passed) {
            throw 'Evidence lifecycle emitted an unsuccessful acceptance summary.'
          }
          if ($acceptance.externalProbesRequired -or $acceptance.proxyHttpProbeRequired) {
            throw 'Hosted smoke unexpectedly required external integration probes.'
          }
          if ($acceptance.routeFingerprint -ne $acceptance.stages.Baseline.routeFingerprint -or
              $acceptance.routeFingerprint -ne $acceptance.stages.Ready.routeFingerprint -or
              $acceptance.routeFingerprint -ne $acceptance.stages.Final.routeFingerprint) {
            throw 'Acceptance summary did not preserve one route fingerprint across all stages.'
          }

          # Exercise the release-grade process/binary contract without launching the
          # application or contacting a real VPN endpoint. The aggregate validator
          # re-runs stage integrity validation after this controlled Ready mutation.
          $syntheticExecutableSha256 = ('ab' * 32)
          $readyEvidencePath = Join-Path (Join-Path $output 'ready') 'evidence.json'
          $readyEvidence = Get-Content -LiteralPath $readyEvidencePath -Raw | ConvertFrom-Json
          $readyEvidence.process.value = @(
            [pscustomobject]@{
              Id = 4242
              ProcessName = 'ProxyToAnyConnect'
              StartTime = [DateTimeOffset]::UtcNow
              WorkingSet64 = 1
              PrivateMemorySize64 = 1
              HandleCount = 1
              ThreadCount = 1
              ExecutableSha256 = $syntheticExecutableSha256
              ExecutableHashError = $null
            }
          )
          $readyEvidence | ConvertTo-Json -Depth 8 | Set-Content -LiteralPath $readyEvidencePath -Encoding utf8

          ./tools/Complete-WindowsIntegrationEvidence.ps1 `
            -OutputDirectory $output `
            -ExpectedExecutableSha256 $syntheticExecutableSha256 `
            -RequireProcessLifecycle | Write-Host

          $identityAcceptance = Get-Content -LiteralPath $acceptancePath -Raw | ConvertFrom-Json
          if (-not $identityAcceptance.processLifecycleRequired -or
              $identityAcceptance.expectedExecutableSha256 -ne $syntheticExecutableSha256 -or
              $identityAcceptance.readyExecutableSha256 -ne $syntheticExecutableSha256 -or
              $identityAcceptance.stages.Baseline.processCount -ne 0 -or
              $identityAcceptance.stages.Ready.processCount -ne 1 -or
              $identityAcceptance.stages.Final.processCount -ne 0) {
            throw 'Evidence lifecycle did not enforce exact Ready binary/process identity.'
          }

          # Exercise the heterogeneous egress contract without contacting the network.
          # The Ready bundle is mutated as one internally-consistent synthetic capture;
          # Test-WindowsIntegrationEvidence must validate the recorded expectation/probe/
          # assertion relationship before Complete aggregates it.
          $proxyA = '127.0.0.1:18080'
          $proxyB = '127.0.0.1:18081'
          $proxyADefaultIPv4 = '198.51.100.10'
          $proxyBOverrideIPv4 = '203.0.113.20'
          $directExpectedIPv4 = '192.0.2.30'
          $readyEvidence = Get-Content -LiteralPath $readyEvidencePath -Raw | ConvertFrom-Json
          $readyEvidence.expectations = [pscustomobject]@{
            directPublicIPv4 = $directExpectedIPv4
            defaultProxyPublicIPv4 = $proxyADefaultIPv4
            proxyPublicIPv4 = @(
              [pscustomobject]@{ endpoint = $proxyB; publicIPv4 = $proxyBOverrideIPv4 }
            )
          }
          $readyEvidence.probes = @(
            [pscustomobject]@{
              name = 'directHttps'
              succeeded = $true
              value = [pscustomobject]@{ output = $directExpectedIPv4; succeeded = $true }
              error = $null
            },
            [pscustomobject]@{
              name = "proxyHttps:$proxyA"
              succeeded = $true
              value = [pscustomobject]@{ output = $proxyADefaultIPv4; succeeded = $true }
              error = $null
            },
            [pscustomobject]@{
              name = "proxyHttps:$proxyB"
              succeeded = $true
              value = [pscustomobject]@{ output = $proxyBOverrideIPv4; succeeded = $true }
              error = $null
            }
          )
          $readyEvidence.assertions = @(
            @($readyEvidence.assertions) + @(
              [pscustomobject]@{
                name = 'expectedDirectPublicIPv4'
                expected = $directExpectedIPv4
                actual = $directExpectedIPv4
                passed = $true
              },
              [pscustomobject]@{
                name = "expectedProxyPublicIPv4:$proxyA"
                expected = $proxyADefaultIPv4
                actual = $proxyADefaultIPv4
                passed = $true
              },
              [pscustomobject]@{
                name = "expectedProxyPublicIPv4:$proxyB"
                expected = $proxyBOverrideIPv4
                actual = $proxyBOverrideIPv4
                passed = $true
              }
            )
          )
          $readyEvidence | ConvertTo-Json -Depth 8 | Set-Content -LiteralPath $readyEvidencePath -Encoding utf8

          $readySummaryPath = Join-Path (Join-Path $output 'ready') 'summary.json'
          $readySummary = Get-Content -LiteralPath $readySummaryPath -Raw | ConvertFrom-Json
          $readyFailedAssertions = @($readyEvidence.assertions | Where-Object { -not $_.passed })
          $readySummary.assertionCount = @($readyEvidence.assertions).Count
          $readySummary.failedAssertionCount = $readyFailedAssertions.Count
          $readySummary.failedAssertions = @($readyFailedAssertions | ForEach-Object name)
          $readySummary | ConvertTo-Json -Depth 6 | Set-Content -LiteralPath $readySummaryPath -Encoding utf8

          $syntheticProxyExpectations = @{ $proxyB = $proxyBOverrideIPv4 }
          ./tools/Complete-WindowsIntegrationEvidence.ps1 `
            -OutputDirectory $output `
            -ProxyEndpoint @($proxyA, $proxyB) `
            -ExpectedVpnPublicIPv4 $proxyADefaultIPv4 `
            -ExpectedProxyPublicIPv4 $syntheticProxyExpectations `
            -ExpectedDirectPublicIPv4 $directExpectedIPv4 `
            -ExpectedExecutableSha256 $syntheticExecutableSha256 `
            -RequireProcessLifecycle `
            -RequireExternalProbes | Write-Host

          $egressAcceptance = Get-Content -LiteralPath $acceptancePath -Raw | ConvertFrom-Json
          $expectedProxyA = [string]$egressAcceptance.effectiveExpectedProxyPublicIPv4.PSObject.Properties[$proxyA].Value
          $expectedProxyB = [string]$egressAcceptance.effectiveExpectedProxyPublicIPv4.PSObject.Properties[$proxyB].Value
          $observedProxyA = [string]$egressAcceptance.proxyPublicIPv4.PSObject.Properties[$proxyA].Value
          $observedProxyB = [string]$egressAcceptance.proxyPublicIPv4.PSObject.Properties[$proxyB].Value
          if (-not $egressAcceptance.externalProbesRequired -or
              $egressAcceptance.expectedDirectPublicIPv4 -ne $directExpectedIPv4 -or
              $egressAcceptance.directPublicIPv4 -ne $directExpectedIPv4 -or
              $expectedProxyA -ne $proxyADefaultIPv4 -or
              $expectedProxyB -ne $proxyBOverrideIPv4 -or
              $observedProxyA -ne $proxyADefaultIPv4 -or
              $observedProxyB -ne $proxyBOverrideIPv4) {
            throw 'Evidence lifecycle did not preserve heterogeneous proxy/direct egress expectations.'
          }

          # Aggregate mismatches must fail without replacing the last successful verdict.
          $acceptedHash = (Get-FileHash -LiteralPath $acceptancePath -Algorithm SHA256).Hash
          $wrongProxyRejected = $false
          try {
            ./tools/Complete-WindowsIntegrationEvidence.ps1 `
              -OutputDirectory $output `
              -ProxyEndpoint @($proxyA, $proxyB) `
              -ExpectedVpnPublicIPv4 $proxyADefaultIPv4 `
              -ExpectedProxyPublicIPv4 @{ $proxyB = '203.0.113.21' } `
              -ExpectedDirectPublicIPv4 $directExpectedIPv4 `
              -ExpectedExecutableSha256 $syntheticExecutableSha256 `
              -RequireProcessLifecycle `
              -RequireExternalProbes | Out-Null
          }
          catch {
            $wrongProxyRejected = $true
          }
          if (-not $wrongProxyRejected) {
            throw 'Aggregate evidence accepted an incorrect per-proxy public IPv4 expectation.'
          }

          $wrongDirectRejected = $false
          try {
            ./tools/Complete-WindowsIntegrationEvidence.ps1 `
              -OutputDirectory $output `
              -ProxyEndpoint @($proxyA, $proxyB) `
              -ExpectedVpnPublicIPv4 $proxyADefaultIPv4 `
              -ExpectedProxyPublicIPv4 $syntheticProxyExpectations `
              -ExpectedDirectPublicIPv4 '192.0.2.31' `
              -ExpectedExecutableSha256 $syntheticExecutableSha256 `
              -RequireProcessLifecycle `
              -RequireExternalProbes | Out-Null
          }
          catch {
            $wrongDirectRejected = $true
          }
          if (-not $wrongDirectRejected) {
            throw 'Aggregate evidence accepted an incorrect direct-host public IPv4 expectation.'
          }
          if ((Get-FileHash -LiteralPath $acceptancePath -Algorithm SHA256).Hash -ne $acceptedHash) {
            throw 'A rejected aggregate egress verdict replaced the last successful acceptance summary.'
          }

          # Stage validation must also reject internally inconsistent expectation metadata.
          $tamperedOutput = './artifacts/integration-evidence-egress-tampered'
          if (Test-Path -LiteralPath $tamperedOutput) {
            Remove-Item -LiteralPath $tamperedOutput -Recurse -Force
          }
          Copy-Item -LiteralPath $output -Destination $tamperedOutput -Recurse
          $tamperedReadyPath = Join-Path (Join-Path $tamperedOutput 'ready') 'evidence.json'
          $tamperedReady = Get-Content -LiteralPath $tamperedReadyPath -Raw | ConvertFrom-Json
          $tamperedReady.expectations.directPublicIPv4 = '192.0.2.31'
          $tamperedReady | ConvertTo-Json -Depth 8 | Set-Content -LiteralPath $tamperedReadyPath -Encoding utf8
          $tamperedRejected = $false
          try {
            ./tools/Test-WindowsIntegrationEvidence.ps1 `
              -Stage Ready `
              -OutputDirectory $tamperedOutput | Out-Null
          }
          catch {
            $tamperedRejected = $true
          }
          if (-not $tamperedRejected) {
            throw 'Stage evidence validator accepted inconsistent direct-egress expectation metadata.'
          }

      - name: Smoke-test Windows soak evidence lifecycle
        shell: pwsh
        run: |
          $process = Get-Process -Id $PID
          $process.Refresh()
          $hash = (Get-FileHash -LiteralPath $process.Path -Algorithm SHA256).Hash.ToLowerInvariant()
          $output = './artifacts/windows-soak-evidence-smoke'

          ./tools/Invoke-WindowsSoakEvidence.ps1 `
            -ProcessId $PID `
            -ExpectedProcessName $process.ProcessName `
            -ExpectedExecutableSha256 $hash `
            -DurationSeconds 2 `
            -SampleIntervalSeconds 1 `
            -OutputDirectory $output | Write-Host

          $soakValidation = ./tools/Test-WindowsSoakEvidence.ps1 `
            -OutputDirectory $output `
            -ExpectedExecutableSha256 $hash `
            -MinimumSamples 2 `
            -MinimumObservedDurationSeconds 1 | ConvertFrom-Json
          if (-not $soakValidation.validated -or
              $soakValidation.validationMemoryModel -ne 'streaming-o1') {
            throw 'Soak evidence validator did not report streaming O(1) validation semantics.'
          }
          $soakValidation | ConvertTo-Json -Depth 4 | Write-Host

          # Prove the manifest covers result.json too. A copied bundle remains valid
          # until one manifested payload is altered, after which validation must fail.
          $tamperedOutput = './artifacts/windows-soak-evidence-tampered'
          Copy-Item -LiteralPath $output -Destination $tamperedOutput -Recurse
          Add-Content -LiteralPath (Join-Path $tamperedOutput 'result.json') -Value ' ' -Encoding utf8
          $tamperRejected = $false
          try {
            ./tools/Test-WindowsSoakEvidence.ps1 `
              -OutputDirectory $tamperedOutput `
              -ExpectedExecutableSha256 $hash `
              -MinimumSamples 2 `
              -MinimumObservedDurationSeconds 1 | Out-Null
          }
          catch {
            $tamperRejected = $true
            Write-Host "PASS: tampered soak bundle rejected: $($_.Exception.Message)"
          }
          if (-not $tamperRejected) {
            throw 'Soak evidence validator accepted a post-manifest result.json mutation.'
          }

          # Correlate a schema-faithful managed-memory log record with the exact
          # external soak PID/start-time identity. Production emits these fields from
          # ProcessMemoryHealthMonitor; the smoke avoids launching the GUI/VPN stack.
          $metadata = Get-Content -LiteralPath (Join-Path $output 'metadata.json') -Raw | ConvertFrom-Json
          $memoryLog = './artifacts/windows-soak-memory-smoke.jsonl'
          $memoryEntry = [ordered]@{
            TimestampUtc = ([DateTimeOffset]::Parse([string]$metadata.startedAtUtc)).AddMilliseconds(500).ToString('O')
            Level = 'Information'
            Event = 'process.memory.periodic'
            Message = 'synthetic hosted correlation smoke'
            Data = [ordered]@{
              ProcessId = [int]$metadata.processId
              ProcessStartTimeUtc = [string]$metadata.processStartTimeUtc
              ManagedHeapBytes = 1
              TotalAllocatedBytes = 2
              WorkingSetBytes = 3
              PrivateBytes = 4
              Gen0Collections = 0
              Gen1Collections = 0
              Gen2Collections = 0
              HandleCount = 5
              ThreadCount = 6
            }
            Exception = $null
          }
          $memoryEntry | ConvertTo-Json -Depth 6 -Compress | Set-Content -LiteralPath $memoryLog -Encoding utf8

          $correlationSummaryPath = './artifacts/windows-soak-correlation-summary.json'
          $correlation = ./tools/Test-WindowsSoakLogCorrelation.ps1 `
            -OutputDirectory $output `
            -ExpectedExecutableSha256 $hash `
            -ApplicationLogPath $memoryLog `
            -MinimumSoakSamples 2 `
            -MinimumObservedDurationSeconds 1 `
            -MinimumMemoryRecords 1 `
            -CorrelationSummaryPath $correlationSummaryPath | ConvertFrom-Json
          if (-not $correlation.correlated -or
              -not $correlation.bundleValidated -or
              $correlation.executableSha256 -ne $hash -or
              $correlation.validationMemoryModel -ne 'streaming-o1') {
            throw 'Soak/log correlation did not enforce exact sealed-bundle streaming semantics.'
          }
          if (-not (Test-Path -LiteralPath $correlationSummaryPath -PathType Leaf)) {
            throw 'Soak/log correlation did not publish its derived summary artifact.'
          }
          $correlationFile = Get-Content -LiteralPath $correlationSummaryPath -Raw | ConvertFrom-Json
          if ($correlationFile.schemaVersion -ne $correlation.schemaVersion -or
              $correlationFile.processId -ne $correlation.processId -or
              $correlationFile.processStartTimeUtc -ne $correlation.processStartTimeUtc -or
              $correlationFile.executableSha256 -ne $correlation.executableSha256 -or
              $correlationFile.memoryRecordCount -ne $correlation.memoryRecordCount) {
            throw 'Derived correlation summary does not match stdout correlation result.'
          }
          $correlationSummaryHash = (Get-FileHash -LiteralPath $correlationSummaryPath -Algorithm SHA256).Hash
          $correlation | ConvertTo-Json -Depth 4 | Write-Host

          $wrongIdentityLog = './artifacts/windows-soak-memory-wrong-identity.jsonl'
          $wrongIdentityEntry = Get-Content -LiteralPath $memoryLog -Raw | ConvertFrom-Json
          $wrongIdentityEntry.Data.ProcessId = [int]$metadata.processId + 1
          $wrongIdentityEntry | ConvertTo-Json -Depth 6 -Compress | Set-Content -LiteralPath $wrongIdentityLog -Encoding utf8
          $identityMismatchRejected = $false
          try {
            ./tools/Test-WindowsSoakLogCorrelation.ps1 `
              -OutputDirectory $output `
              -ExpectedExecutableSha256 $hash `
              -ApplicationLogPath $wrongIdentityLog `
              -MinimumSoakSamples 2 `
              -MinimumObservedDurationSeconds 1 `
              -MinimumMemoryRecords 1 `
              -CorrelationSummaryPath $correlationSummaryPath | Out-Null
          }
          catch {
            $identityMismatchRejected = $true
            Write-Host "PASS: wrong managed-memory process identity rejected: $($_.Exception.Message)"
          }
          if (-not $identityMismatchRejected) {
            throw 'Soak/log correlation accepted managed-memory records from a different process identity.'
          }
          if ((Get-FileHash -LiteralPath $correlationSummaryPath -Algorithm SHA256).Hash -ne $correlationSummaryHash) {
            throw 'Failed process-identity correlation replaced the previously accepted derived summary.'
          }

          # Correlation itself must validate the sealed external bundle. Reusing the
          # good memory record with a post-manifest-mutated bundle must fail before
          # any process-memory conclusion is produced.
          $tamperedCorrelationRejected = $false
          try {
            ./tools/Test-WindowsSoakLogCorrelation.ps1 `
              -OutputDirectory $tamperedOutput `
              -ExpectedExecutableSha256 $hash `
              -ApplicationLogPath $memoryLog `
              -MinimumSoakSamples 2 `
              -MinimumObservedDurationSeconds 1 `
              -MinimumMemoryRecords 1 `
              -CorrelationSummaryPath $correlationSummaryPath | Out-Null
          }
          catch {
            $tamperedCorrelationRejected = $true
            Write-Host "PASS: correlation rejected tampered soak bundle: $($_.Exception.Message)"
          }
          if (-not $tamperedCorrelationRejected) {
            throw 'Soak/log correlation trusted a tampered external evidence bundle.'
          }
          if ((Get-FileHash -LiteralPath $correlationSummaryPath -Algorithm SHA256).Hash -ne $correlationSummaryHash) {
            throw 'Tampered-bundle correlation replaced the previously accepted derived summary.'
          }

          $insideBundleSummaryRejected = $false
          try {
            ./tools/Test-WindowsSoakLogCorrelation.ps1 `
              -OutputDirectory $output `
              -ExpectedExecutableSha256 $hash `
              -ApplicationLogPath $memoryLog `
              -MinimumSoakSamples 2 `
              -MinimumObservedDurationSeconds 1 `
              -MinimumMemoryRecords 1 `
              -CorrelationSummaryPath (Join-Path $output 'derived-correlation.json') | Out-Null
          }
          catch {
            $insideBundleSummaryRejected = $true
            Write-Host "PASS: derived summary inside sealed bundle rejected: $($_.Exception.Message)"
          }
          if (-not $insideBundleSummaryRejected) {
            throw 'Correlation allowed a derived summary to mutate the sealed soak evidence directory.'
          }

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore ProxyToAnyConnect.sln

      - name: Build
        run: dotnet build ProxyToAnyConnect.sln --configuration Release --no-restore

      - name: Self-tests
        shell: pwsh
        run: ./tests/ProxyToAnyConnect.SelfTests/bin/x64/Release/net10.0-windows/win-x64/ProxyToAnyConnect.SelfTests.exe

      - name: Publish self-contained win-x64
        if: github.event_name == 'push'
        run: >-
          dotnet publish src/ProxyToAnyConnect/ProxyToAnyConnect.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          --output artifacts/ProxyToAnyConnect-win-x64

      - name: Write binary integrity manifest
        if: github.event_name == 'push'
        shell: pwsh
        run: |
          $publishDirectory = './artifacts/ProxyToAnyConnect-win-x64'
          $executablePath = Join-Path $publishDirectory 'ProxyToAnyConnect.exe'
          if (-not (Test-Path -LiteralPath $executablePath -PathType Leaf)) {
            throw "Published executable is missing: $executablePath"
          }

          $hash = (Get-FileHash -LiteralPath $executablePath -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content `
            -LiteralPath (Join-Path $publishDirectory 'ProxyToAnyConnect.exe.sha256') `
            -Value "$hash  ProxyToAnyConnect.exe" `
            -Encoding ascii

          [ordered]@{
            schemaVersion = 1
            gitCommit = '${{ github.sha }}'
            fileName = 'ProxyToAnyConnect.exe'
            sha256 = $hash
          } | ConvertTo-Json -Depth 4 | Set-Content `
            -LiteralPath (Join-Path $publishDirectory 'build-identity.json') `
            -Encoding utf8

      - name: Create ZIP
        if: github.event_name == 'push'
        shell: pwsh
        run: Compress-Archive -Path ./artifacts/ProxyToAnyConnect-win-x64/* -DestinationPath ./artifacts/ProxyToAnyConnect-win-x64.zip -Force

      - name: Upload Windows artifact
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: ProxyToAnyConnect-win-x64
          path: artifacts/ProxyToAnyConnect-win-x64.zip
          if-no-files-found: error
