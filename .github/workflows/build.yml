name: build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate PowerShell tools
        shell: pwsh
        run: |
          $toolPaths = @(
            './tools/Invoke-WindowsIntegrationEvidence.ps1',
            './tools/Test-WindowsIntegrationEvidence.ps1',
            './tools/Complete-WindowsIntegrationEvidence.ps1',
            './tools/Invoke-WindowsSoakEvidence.ps1',
            './tools/Test-WindowsSoakEvidence.ps1',
            './tools/Test-WindowsSoakLogCorrelation.ps1'
          )
          foreach ($toolPath in $toolPaths) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $toolPath),
              [ref]$tokens,
              [ref]$errors) | Out-Null
            if ($errors.Count -ne 0) {
              $errors | ForEach-Object { Write-Error "${toolPath}: $($_.Message)" }
              exit 1
            }
          }

      - name: Smoke-test Windows integration evidence lifecycle
        shell: pwsh
        run: |
          $output = './artifacts/integration-evidence-smoke'
          foreach ($stage in @('Baseline', 'Ready', 'Final')) {
            ./tools/Invoke-WindowsIntegrationEvidence.ps1 `
              -Stage $stage `
              -OutputDirectory $output `
              -SkipExternalProbes | Write-Host
          }

          ./tools/Complete-WindowsIntegrationEvidence.ps1 `
            -OutputDirectory $output | Write-Host

          foreach ($stage in @('baseline', 'ready', 'final')) {
            foreach ($fileName in @('evidence.json', 'summary.json', 'manifest.json')) {
              $requiredPath = Join-Path (Join-Path $output $stage) $fileName
              if (-not (Test-Path -LiteralPath $requiredPath -PathType Leaf)) {
                throw "Evidence lifecycle did not create $requiredPath"
              }
            }
          }

          $acceptancePath = Join-Path $output 'acceptance-summary.json'
          if (-not (Test-Path -LiteralPath $acceptancePath -PathType Leaf)) {
            throw "Evidence lifecycle did not create $acceptancePath"
          }

          $acceptance = Get-Content -LiteralPath $acceptancePath -Raw | ConvertFrom-Json
          if ($acceptance.schemaVersion -ne 1 -or -not $acceptance.passed) {
            throw 'Evidence lifecycle emitted an unsuccessful acceptance summary.'
          }
          if ($acceptance.externalProbesRequired -or $acceptance.proxyHttpProbeRequired) {
            throw 'Hosted smoke unexpectedly required external integration probes.'
          }
          if ($acceptance.routeFingerprint -ne $acceptance.stages.Baseline.routeFingerprint -or
              $acceptance.routeFingerprint -ne $acceptance.stages.Ready.routeFingerprint -or
              $acceptance.routeFingerprint -ne $acceptance.stages.Final.routeFingerprint) {
            throw 'Acceptance summary did not preserve one route fingerprint across all stages.'
          }

          # Exercise the release-grade process/binary contract without launching the
          # application or contacting a real VPN endpoint. The aggregate validator
          # re-runs stage integrity validation after this controlled Ready mutation.
          $syntheticExecutableSha256 = ('ab' * 32)
          $readyEvidencePath = Join-Path (Join-Path $output 'ready') 'evidence.json'
          $readyEvidence = Get-Content -LiteralPath $readyEvidencePath -Raw | ConvertFrom-Json
          $readyEvidence.process.value = @(
            [pscustomobject]@{
              Id = 4242
              ProcessName = 'ProxyToAnyConnect'
              StartTime = [DateTimeOffset]::UtcNow
              WorkingSet64 = 1
              PrivateMemorySize64 = 1
              HandleCount = 1
              ThreadCount = 1
              ExecutableSha256 = $syntheticExecutableSha256
              ExecutableHashError = $null
            }
          )
          $readyEvidence | ConvertTo-Json -Depth 8 | Set-Content -LiteralPath $readyEvidencePath -Encoding utf8

          ./tools/Complete-WindowsIntegrationEvidence.ps1 `
            -OutputDirectory $output `
            -ExpectedExecutableSha256 $syntheticExecutableSha256 `
            -RequireProcessLifecycle | Write-Host

          $identityAcceptance = Get-Content -LiteralPath $acceptancePath -Raw | ConvertFrom-Json
          if (-not $identityAcceptance.processLifecycleRequired -or
              $identityAcceptance.expectedExecutableSha256 -ne $syntheticExecutableSha256 -or
              $identityAcceptance.readyExecutableSha256 -ne $syntheticExecutableSha256 -or
              $identityAcceptance.stages.Baseline.processCount -ne 0 -or
              $identityAcceptance.stages.Ready.processCount -ne 1 -or
              $identityAcceptance.stages.Final.processCount -ne 0) {
            throw 'Evidence lifecycle did not enforce exact Ready binary/process identity.'
          }

      - name: Smoke-test Windows soak evidence lifecycle
        shell: pwsh
        run: |
          $process = Get-Process -Id $PID
          $process.Refresh()
          $hash = (Get-FileHash -LiteralPath $process.Path -Algorithm SHA256).Hash.ToLowerInvariant()
          $output = './artifacts/windows-soak-evidence-smoke'

          ./tools/Invoke-WindowsSoakEvidence.ps1 `
            -ProcessId $PID `
            -ExpectedProcessName $process.ProcessName `
            -ExpectedExecutableSha256 $hash `
            -DurationSeconds 2 `
            -SampleIntervalSeconds 1 `
            -OutputDirectory $output | Write-Host

          ./tools/Test-WindowsSoakEvidence.ps1 `
            -OutputDirectory $output `
            -ExpectedExecutableSha256 $hash `
            -MinimumSamples 2 `
            -MinimumObservedDurationSeconds 1 | Write-Host

          # Prove the manifest covers result.json too. A copied bundle remains valid
          # until one manifested payload is altered, after which validation must fail.
          $tamperedOutput = './artifacts/windows-soak-evidence-tampered'
          Copy-Item -LiteralPath $output -Destination $tamperedOutput -Recurse
          Add-Content -LiteralPath (Join-Path $tamperedOutput 'result.json') -Value ' ' -Encoding utf8
          $tamperRejected = $false
          try {
            ./tools/Test-WindowsSoakEvidence.ps1 `
              -OutputDirectory $tamperedOutput `
              -ExpectedExecutableSha256 $hash `
              -MinimumSamples 2 `
              -MinimumObservedDurationSeconds 1 | Out-Null
          }
          catch {
            $tamperRejected = $true
            Write-Host "PASS: tampered soak bundle rejected: $($_.Exception.Message)"
          }
          if (-not $tamperRejected) {
            throw 'Soak evidence validator accepted a post-manifest result.json mutation.'
          }

          # Correlate schema-faithful managed-memory records with the exact external
          # soak PID/start-time identity. Split records across multiple files and
          # deliberately provide them out of chronological order: the correlation
          # validator must use bounded timestamp-extreme aggregation, not input order.
          $metadata = Get-Content -LiteralPath (Join-Path $output 'metadata.json') -Raw | ConvertFrom-Json
          $started = [DateTimeOffset]::Parse([string]$metadata.startedAtUtc)
          function New-MemoryEntry([int]$offsetMilliseconds, [long]$heap, [long]$allocated, [long]$working, [long]$private, [int]$handles, [int]$threads) {
            [ordered]@{
              TimestampUtc = $started.AddMilliseconds($offsetMilliseconds).ToString('O')
              Level = 'Information'
              Event = 'process.memory.periodic'
              Message = 'synthetic hosted correlation smoke'
              Data = [ordered]@{
                ProcessId = [int]$metadata.processId
                ProcessStartTimeUtc = [string]$metadata.processStartTimeUtc
                ManagedHeapBytes = $heap
                TotalAllocatedBytes = $allocated
                WorkingSetBytes = $working
                PrivateBytes = $private
                Gen0Collections = 0
                Gen1Collections = 0
                Gen2Collections = 0
                HandleCount = $handles
                ThreadCount = $threads
              }
              Exception = $null
            }
          }

          $early = New-MemoryEntry 250 10 100 30 40 5 6
          $middle = New-MemoryEntry 500 20 200 90 80 15 16
          $late = New-MemoryEntry 750 30 300 60 120 10 26
          $memoryLogA = './artifacts/windows-soak-memory-late-early.jsonl'
          $memoryLogB = './artifacts/windows-soak-memory-middle.jsonl'
          @($late, $early) | ForEach-Object { $_ | ConvertTo-Json -Depth 6 -Compress } |
            Set-Content -LiteralPath $memoryLogA -Encoding utf8
          $middle | ConvertTo-Json -Depth 6 -Compress |
            Set-Content -LiteralPath $memoryLogB -Encoding utf8

          $correlationJson = ./tools/Test-WindowsSoakLogCorrelation.ps1 `
            -OutputDirectory $output `
            -ApplicationLogPath @($memoryLogA, $memoryLogB) `
            -MinimumMemoryRecords 3
          $correlation = $correlationJson | ConvertFrom-Json
          $correlation | ConvertTo-Json -Depth 4 | Write-Host
          if (-not $correlation.correlated -or
              $correlation.applicationLogCount -ne 2 -or
              $correlation.memoryRecordCount -ne 3 -or
              $correlation.firstManagedHeapBytes -ne 10 -or
              $correlation.lastManagedHeapBytes -ne 30 -or
              $correlation.managedHeapDeltaBytes -ne 20 -or
              $correlation.firstTotalAllocatedBytes -ne 100 -or
              $correlation.lastTotalAllocatedBytes -ne 300 -or
              $correlation.maxWorkingSetBytes -ne 90 -or
              $correlation.maxPrivateBytes -ne 120 -or
              $correlation.maxHandleCount -ne 15 -or
              $correlation.maxThreadCount -ne 26) {
            throw 'Multi-file soak/log correlation did not preserve timestamp-extreme/scalar aggregate semantics.'
          }

          $wrongIdentityLog = './artifacts/windows-soak-memory-wrong-identity.jsonl'
          $wrongIdentityEntry = New-MemoryEntry 500 1 2 3 4 5 6
          $wrongIdentityEntry.Data.ProcessId = [int]$metadata.processId + 1
          $wrongIdentityEntry | ConvertTo-Json -Depth 6 -Compress | Set-Content -LiteralPath $wrongIdentityLog -Encoding utf8
          $identityMismatchRejected = $false
          try {
            ./tools/Test-WindowsSoakLogCorrelation.ps1 `
              -OutputDirectory $output `
              -ApplicationLogPath $wrongIdentityLog `
              -MinimumMemoryRecords 1 | Out-Null
          }
          catch {
            $identityMismatchRejected = $true
            Write-Host "PASS: wrong managed-memory process identity rejected: $($_.Exception.Message)"
          }
          if (-not $identityMismatchRejected) {
            throw 'Soak/log correlation accepted managed-memory records from a different process identity.'
          }

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore ProxyToAnyConnect.sln

      - name: Build
        run: dotnet build ProxyToAnyConnect.sln --configuration Release --no-restore

      - name: Self-tests
        shell: pwsh
        run: ./tests/ProxyToAnyConnect.SelfTests/bin/x64/Release/net10.0-windows/win-x64/ProxyToAnyConnect.SelfTests.exe

      - name: Publish self-contained win-x64
        if: github.event_name == 'push'
        run: >-
          dotnet publish src/ProxyToAnyConnect/ProxyToAnyConnect.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          --output artifacts/ProxyToAnyConnect-win-x64

      - name: Write binary integrity manifest
        if: github.event_name == 'push'
        shell: pwsh
        run: |
          $publishDirectory = './artifacts/ProxyToAnyConnect-win-x64'
          $executablePath = Join-Path $publishDirectory 'ProxyToAnyConnect.exe'
          if (-not (Test-Path -LiteralPath $executablePath -PathType Leaf)) {
            throw "Published executable is missing: $executablePath"
          }

          $hash = (Get-FileHash -LiteralPath $executablePath -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content `
            -LiteralPath (Join-Path $publishDirectory 'ProxyToAnyConnect.exe.sha256') `
            -Value "$hash  ProxyToAnyConnect.exe" `
            -Encoding ascii

          [ordered]@{
            schemaVersion = 1
            gitCommit = '${{ github.sha }}'
            fileName = 'ProxyToAnyConnect.exe'
            sha256 = $hash
          } | ConvertTo-Json -Depth 4 | Set-Content `
            -LiteralPath (Join-Path $publishDirectory 'build-identity.json') `
            -Encoding utf8

      - name: Create ZIP
        if: github.event_name == 'push'
        shell: pwsh
        run: Compress-Archive -Path ./artifacts/ProxyToAnyConnect-win-x64/* -DestinationPath ./artifacts/ProxyToAnyConnect-win-x64.zip -Force

      - name: Upload Windows artifact
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: ProxyToAnyConnect-win-x64
          path: artifacts/ProxyToAnyConnect-win-x64.zip
          if-no-files-found: error
