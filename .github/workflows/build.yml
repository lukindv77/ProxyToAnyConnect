name: build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate PowerShell tools
        shell: pwsh
        run: |
          $toolPaths = @(
            './tools/Invoke-WindowsIntegrationEvidence.ps1',
            './tools/Test-WindowsIntegrationEvidence.ps1'
          )
          foreach ($toolPath in $toolPaths) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $toolPath),
              [ref]$tokens,
              [ref]$errors) | Out-Null
            if ($errors.Count -ne 0) {
              $errors | ForEach-Object { Write-Error "${toolPath}: $($_.Message)" }
              exit 1
            }
          }

      - name: Smoke-test Windows integration evidence
        shell: pwsh
        run: |
          $output = './artifacts/integration-evidence-smoke'
          ./tools/Invoke-WindowsIntegrationEvidence.ps1 `
            -Stage Baseline `
            -OutputDirectory $output `
            -SkipExternalProbes | Write-Host

          ./tools/Test-WindowsIntegrationEvidence.ps1 `
            -Stage Baseline `
            -OutputDirectory $output | Write-Host

          $evidencePath = Join-Path $output 'baseline/evidence.json'
          $summaryPath = Join-Path $output 'baseline/summary.json'
          $manifestPath = Join-Path $output 'baseline/manifest.json'
          foreach ($requiredPath in @($evidencePath, $summaryPath, $manifestPath)) {
            if (-not (Test-Path -LiteralPath $requiredPath -PathType Leaf)) {
              throw "Evidence harness did not create $requiredPath"
            }
          }

          $evidence = Get-Content -LiteralPath $evidencePath -Raw | ConvertFrom-Json
          $summary = Get-Content -LiteralPath $summaryPath -Raw | ConvertFrom-Json
          $manifest = Get-Content -LiteralPath $manifestPath -Raw | ConvertFrom-Json
          if ($evidence.schemaVersion -ne 1 -or $evidence.stage -ne 'Baseline') {
            throw 'Evidence harness emitted an unexpected schema/stage.'
          }
          if ($summary.stage -ne 'Baseline' -or $summary.failedAssertionCount -ne 0) {
            throw 'Baseline evidence smoke test unexpectedly reported failed assertions.'
          }
          if ($manifest.stage -ne 'Baseline' -or $manifest.fileCount -lt 2) {
            throw 'Evidence validator emitted an incomplete integrity manifest.'
          }

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore ProxyToAnyConnect.sln

      - name: Build
        run: dotnet build ProxyToAnyConnect.sln --configuration Release --no-restore

      - name: Self-tests
        shell: pwsh
        run: ./tests/ProxyToAnyConnect.SelfTests/bin/x64/Release/net10.0-windows/win-x64/ProxyToAnyConnect.SelfTests.exe

      - name: Publish self-contained win-x64
        if: github.event_name == 'push'
        run: >-
          dotnet publish src/ProxyToAnyConnect/ProxyToAnyConnect.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          --output artifacts/ProxyToAnyConnect-win-x64

      - name: Create ZIP
        if: github.event_name == 'push'
        shell: pwsh
        run: Compress-Archive -Path ./artifacts/ProxyToAnyConnect-win-x64/* -DestinationPath ./artifacts/ProxyToAnyConnect-win-x64.zip -Force

      - name: Upload Windows artifact
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: ProxyToAnyConnect-win-x64
          path: artifacts/ProxyToAnyConnect-win-x64.zip
          if-no-files-found: error
